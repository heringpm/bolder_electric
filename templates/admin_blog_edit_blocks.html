<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor | Bolder Electric Admin</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <!-- GrapesJS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.13/dist/css/grapes.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #111;
            --panel2: #161616;
            --line: rgba(241,186,32,0.22);
            --gold: #f1ba20;
            --text: #f5f3ef;
            --muted: rgba(245,243,239,0.6);
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }

        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .title-input {
            font-size: 20px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: var(--text);
            flex: 1;
        }

        .title-input:focus { outline: none; color: var(--gold); }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--line);
            background: rgba(241,186,32,0.12);
            color: var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        #editor { height: calc(100vh - 60px); }

        /* Theme customization for GrapesJS */
        .gjs-editor-cont {
            background: var(--bg) !important;
        }

        .gjs-panel__top {
            background: var(--panel) !important;
            border-bottom: 1px solid var(--line) !important;
        }

        .gjs-pn-panel {
            background: var(--panel2) !important;
            border-color: var(--line) !important;
        }

        .gjs-pn-btn {
            color: var(--muted) !important;
        }

        .gjs-pn-btn:hover {
            background: rgba(241,186,32,0.1) !important;
            color: var(--gold) !important;
        }

        .gjs-pn-btn.gjs-pn-active {
            background: rgba(241,186,32,0.2) !important;
            color: var(--gold) !important;
        }

        .gjs-pn-input {
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid var(--line) !important;
            color: var(--text) !important;
        }

        .gjs-pn-input:focus {
            border-color: var(--gold) !important;
        }

        .gjs-pn-label {
            color: var(--muted) !important;
        }

        .gjs-block {
            background: rgba(241,186,32,0.1) !important;
            border: 1px solid rgba(241,186,32,0.2) !important;
            color: var(--text) !important;
        }

        .gjs-block:hover {
            background: rgba(241,186,32,0.2) !important;
        }

        .gjs-canvas {
            background: linear-gradient(135deg, rgba(241,186,32,0.02) 0%, transparent 100%) !important;
        }

        .gjs-frame {
            background: var(--panel) !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title }}">
        <button class="btn" onclick="goBack()">← Discard</button>
        <button class="btn primary" onclick="savePost()">Save & Publish</button>
    </div>

    <div id="editor"></div>

    <!-- GrapesJS -->
    <script src="https://unpkg.com/grapesjs@0.21.13/dist/grapes.min.js"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        // Initialize GrapesJS
        const editor = grapesjs.init({
            container: '#editor',
            fromElement: false,
            height: '100%',
            showOffsets: 1,
            noticeOnUnload: 0,
            storageManager: false,
            canvas: {
                styles: [
                    'https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap'
                ]
            },
            blocks: [
                {
                    id: 'section-text',
                    label: 'Text Section',
                    content: '<div style="padding: 20px; background: #f5f3ef; color: #0a0a0a; border-radius: 4px;"><p>Add your text here</p></div>',
                    category: 'Basic'
                },
                {
                    id: 'section-image',
                    label: 'Image Section',
                    content: '<img src="https://via.placeholder.com/600x400" alt="Image" style="width: 100%; border-radius: 4px; display: block;">',
                    category: 'Basic'
                },
                {
                    id: 'section-two-col',
                    label: 'Two Column',
                    content: '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;"><div style="padding: 20px; background: #f5f3ef; color: #0a0a0a; border-radius: 4px;"><p>Column 1</p></div><div style="padding: 20px; background: #f5f3ef; color: #0a0a0a; border-radius: 4px;"><p>Column 2</p></div></div>',
                    category: 'Layout'
                }
            ],
            styleManager: {
                sectors: [
                    {
                        name: 'Dimension',
                        open: false,
                        properties: [
                            'width',
                            'height',
                            'max-width',
                            'margin',
                            'padding'
                        ]
                    },
                    {
                        name: 'Typography',
                        open: false,
                        properties: [
                            'font-family',
                            'font-size',
                            'font-weight',
                            'line-height',
                            'color'
                        ]
                    },
                    {
                        name: 'Decorations',
                        open: false,
                        properties: [
                            'background-color',
                            'border',
                            'border-radius'
                        ]
                    }
                ]
            }
        });

        // Load existing content
        if (postContent && postContent.trim()) {
            editor.setComponents(postContent);
        } else {
            editor.setComponents('<div style="padding: 40px; text-align: center; color: #999;"><p>Start by adding sections from the left panel</p></div>');
        }

        // Add commands
        editor.Commands.add('export-template', {
            run: () => {
                console.log(editor.getHtml());
            }
        });

        editor.Commands.add('show-json', {
            run: () => {
                alert(JSON.stringify(editor.getComponents(), null, 2));
            }
        });

        function goBack() {
            if (confirm('Discard all changes?')) {
                window.location.href = '/admin#blog';
            }
        }

        function savePost() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            const html = editor.getHtml();
            const css = editor.getCss();
            const content = html + '<style>' + css + '</style>';

            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt }}',
                content: content,
                hero_image: '{{ post.hero_image }}',
                template: '{{ post.template }}',
                status: 'published'
            });

            const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;

            fetch(endpoint, {
                method: 'POST',
                headers: { 'X-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error('Save failed');
                window.location.href = '/admin#blog';
            })
            .catch(err => {
                alert('Error saving post: ' + err.message);
            });
        }

        // Add image upload capability
        editor.on('component:update', function() {
            const selected = editor.getSelected();
            if (selected && selected.get('tagName') === 'img') {
                console.log('Image selected');
            }
        });
    </script>
</body>
</html>
