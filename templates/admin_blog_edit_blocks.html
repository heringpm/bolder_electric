<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Bolder Electric</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='js/grapes.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        .top-bar {
            background: #111;
            border-bottom: 1px solid rgba(241,186,32,0.22);
            padding: 12px 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            height: 60px;
            z-index: 1000;
        }

        .title-input {
            font-size: 16px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: #f5f3ef;
            flex: 1;
            padding: 8px;
        }

        .title-input:focus { outline: none; color: #f1ba20; }

        .btn {
            padding: 8px 14px;
            border: 1px solid rgba(241,186,32,0.22);
            background: rgba(241,186,32,0.12);
            color: #f1ba20;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        .editor-wrapper {
            display: flex;
            height: calc(100vh - 60px);
        }

        #editor {
            flex: 1;
            height: 100%;
        }

        /* GrapesJS Style Overrides */
        .gjs-editor-cont {
            background: #0a0a0a !important;
        }

        .gjs-panel__top {
            background: #111 !important;
            border-bottom: 1px solid rgba(241,186,32,0.22) !important;
        }

        .gjs-pn-panel {
            background: #161616 !important;
            border-color: rgba(241,186,32,0.22) !important;
        }

        .gjs-pn-title {
            background: #111 !important;
            border-bottom: 1px solid rgba(241,186,32,0.22) !important;
            color: #f5f3ef !important;
            font-weight: bold;
            padding: 12px !important;
        }

        .gjs-pn-btn {
            color: rgba(245,243,239,0.6) !important;
            background: transparent !important;
            border: none !important;
        }

        .gjs-pn-btn:hover {
            background: rgba(241,186,32,0.1) !important;
            color: #f1ba20 !important;
        }

        .gjs-pn-btn.gjs-pn-active {
            background: rgba(241,186,32,0.2) !important;
            color: #f1ba20 !important;
        }

        .gjs-pn-input {
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid rgba(241,186,32,0.22) !important;
            color: #f5f3ef !important;
            padding: 6px 8px !important;
        }

        .gjs-pn-input:focus {
            border-color: #f1ba20 !important;
            outline: none !important;
        }

        .gjs-pn-label {
            color: rgba(245,243,239,0.6) !important;
            font-size: 11px !important;
        }

        .gjs-block {
            background: rgba(241,186,32,0.1) !important;
            border: 1px solid rgba(241,186,32,0.2) !important;
            color: #f5f3ef !important;
            padding: 10px !important;
            margin: 5px !important;
            cursor: grab !important;
        }

        .gjs-block:hover {
            background: rgba(241,186,32,0.2) !important;
        }

        .gjs-canvas {
            background: linear-gradient(135deg, rgba(241,186,32,0.02) 0%, transparent 100%) !important;
        }

        .gjs-frame {
            background: #ffffff !important;
        }

        .gjs-viewport {
            background: #1a1a1a !important;
        }

        .gjs-sel-handler {
            background: rgba(241,186,32,0.4) !important;
            border: 1px solid #f1ba20 !important;
        }

        .gjs-component.gjs-selected {
            outline: 2px solid #f1ba20 !important;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="btn" onclick="goBack()">← Back to Admin</button>
        <div style="margin-left: 20px; display: flex; gap: 8px; border-left: 1px solid rgba(241,186,32,0.22); padding-left: 20px;">
            <button class="btn" onclick="undo()" title="Undo (Ctrl+Z)"><i class="fas fa-undo"></i></button>
            <button class="btn" onclick="redo()" title="Redo (Ctrl+Y)"><i class="fas fa-redo"></i></button>
        </div>
        <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title or '' }}">
        <button class="btn" onclick="saveDraft()">Save as Draft</button>
        <button class="btn primary" onclick="publishPost()">Save & Publish</button>
    </div>

    <div class="editor-wrapper">
        <div id="editor"></div>
    </div>

    <script src="{{ url_for('static', filename='js/grapes.min.js') }}"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let editor = null;
        const maxWaitTime = 5000;
        const startTime = Date.now();

        function initEditor() {
            if (typeof grapesjs === 'undefined') {
                if (Date.now() - startTime < maxWaitTime) {
                    setTimeout(initEditor, 100);
                    return;
                }
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: Failed to load editor library.</p>';
                return;
            }

            try {
                editor = grapesjs.init({
                    container: '#editor',
                    fromElement: false,
                    height: '100%',
                    width: '100%',
                    storageManager: false,
                    undoManager: { trackChanges: true },
                    pageManager: {},
                    deviceManager: {
                        devices: [
                            {
                                name: 'Desktop',
                                width: ''
                            },
                            {
                                name: 'Tablet',
                                width: '768px',
                                widthMedia: '768px'
                            },
                            {
                                name: 'Mobile',
                                width: '375px',
                                widthMedia: '375px'
                            }
                        ]
                    },
                    blockManager: {
                        blocks: [
                            {
                                id: 'heading1',
                                label: '<i class="fas fa-heading"></i> H1',
                                content: '<h1 style="font-size: 36px; font-weight: bold; margin: 20px 0;">Heading 1</h1>',
                                category: 'Typography'
                            },
                            {
                                id: 'heading2',
                                label: '<i class="fas fa-heading"></i> H2',
                                content: '<h2 style="font-size: 28px; font-weight: bold; margin: 16px 0;">Heading 2</h2>',
                                category: 'Typography'
                            },
                            {
                                id: 'heading3',
                                label: '<i class="fas fa-heading"></i> H3',
                                content: '<h3 style="font-size: 22px; font-weight: bold; margin: 12px 0;">Heading 3</h3>',
                                category: 'Typography'
                            },
                            {
                                id: 'text',
                                label: '<i class="fas fa-paragraph"></i> Text',
                                content: '<p style="font-size: 16px; line-height: 1.6; margin: 12px 0;">Add your text content here.</p>',
                                category: 'Basic'
                            },
                            {
                                id: 'image',
                                label: '<i class="fas fa-image"></i> Image',
                                content: '<img src="https://via.placeholder.com/600x400" style="width:100%; border-radius: 8px;">',
                                category: 'Media'
                            },
                            {
                                id: 'button',
                                label: '<i class="fas fa-mouse"></i> Button',
                                content: '<a href="#" style="display: inline-block; background: #f1ba20; color: #0a0a0a; padding: 12px 30px; border-radius: 4px; text-decoration: none; font-weight: bold; margin: 10px 0;">Learn More</a>',
                                category: 'Interactive'
                            },
                            {
                                id: 'video',
                                label: '<i class="fas fa-video"></i> Video',
                                content: '<iframe width="100%" height="400" style="border-radius: 8px;" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>',
                                category: 'Media'
                            },
                            {
                                id: 'quote',
                                label: '<i class="fas fa-quote-left"></i> Quote',
                                content: '<blockquote style="border-left: 4px solid #f1ba20; padding-left: 20px; margin: 20px 0; font-style: italic; color: #666;"><p>"Your inspiring quote goes here"</p><p style="font-size: 14px;">— Attribution</p></blockquote>',
                                category: 'Typography'
                            },
                            {
                                id: 'divider',
                                label: '<i class="fas fa-minus"></i> Divider',
                                content: '<hr style="margin: 40px 0; border: none; border-top: 1px solid #ddd;">',
                                category: 'Layout'
                            },
                            {
                                id: 'spacer',
                                label: '<i class="fas fa-arrows-alt-v"></i> Spacer',
                                content: '<div style="height: 40px;"></div>',
                                category: 'Layout'
                            },
                            {
                                id: 'section-two-col',
                                label: '<i class="fas fa-columns"></i> 2 Columns',
                                content: '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px;"><p>Column 1</p></div><div style="padding: 20px;"><p>Column 2</p></div></div>',
                                category: 'Layout'
                            },
                            {
                                id: 'section-three-col',
                                label: '<i class="fas fa-th"></i> 3 Columns',
                                content: '<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 20px 0;"><div style="padding: 15px;"><p>Col 1</p></div><div style="padding: 15px;"><p>Col 2</p></div><div style="padding: 15px;"><p>Col 3</p></div></div>',
                                category: 'Layout'
                            },
                            {
                                id: 'card',
                                label: '<i class="fas fa-rectangle-landscape"></i> Card',
                                content: '<div style="background: white; border: 1px solid #ddd; border-radius: 8px; padding: 30px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"><h3 style="margin-top: 0; margin-bottom: 10px;">Card Title</h3><p style="color: #666; margin: 0;">Card content goes here.</p></div>',
                                category: 'Layout'
                            },
                            {
                                id: 'list',
                                label: '<i class="fas fa-list"></i> List',
                                content: '<ul style="margin: 12px 0; padding-left: 20px;"><li>Item 1</li><li>Item 2</li><li>Item 3</li></ul>',
                                category: 'Basic'
                            }
                        ]
                    },
                    categoryLabel: 'Categories',
                    categories: [
                        { id: 'Typography', label: 'Typography', open: true },
                        { id: 'Basic', label: 'Basic', open: true },
                        { id: 'Media', label: 'Media', open: false },
                        { id: 'Interactive', label: 'Interactive', open: false },
                        { id: 'Layout', label: 'Layout', open: false }
                    ]
                });

                // Load existing content
                if (postContent && postContent.trim()) {
                    try {
                        // Load content with CSS intact
                        editor.setComponents(postContent);
                        console.log('Loaded content with CSS');

                        // Also try to inject CSS into the frame if it exists
                        setTimeout(() => {
                            const styleMatch = postContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
                            if (styleMatch) {
                                const css = styleMatch[1];

                                // Get the editor's iframe and inject the CSS
                                const frame = document.querySelector('iframe[data-gjs]') || document.querySelector('iframe.gjs-frame');
                                if (frame && frame.contentDocument) {
                                    // Remove old style tag to avoid duplicates
                                    const oldStyle = frame.contentDocument.querySelector('style[data-custom-styles]');
                                    if (oldStyle) oldStyle.remove();

                                    // Add new style tag with saved CSS
                                    const styleEl = frame.contentDocument.createElement('style');
                                    styleEl.setAttribute('data-custom-styles', 'true');
                                    styleEl.textContent = css;
                                    frame.contentDocument.head.appendChild(styleEl);

                                    // Also apply body background directly to ensure it sticks
                                    const bodyBgMatch = css.match(/body\s*{[^}]*background-color:\s*([^;]+)/i);
                                    if (bodyBgMatch) {
                                        const bgColor = bodyBgMatch[1].trim();
                                        frame.contentDocument.body.style.backgroundColor = bgColor;
                                        console.log('Applied body background color:', bgColor);
                                    }

                                    console.log('Injected CSS into frame, CSS length:', css.length);
                                }
                            }
                        }, 200);
                    } catch (e) {
                        console.log('Could not parse existing content:', e);
                    }
                }

                console.log('Editor initialized successfully');
            } catch (e) {
                console.error('Error initializing editor:', e);
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: ' + e.message + '</p>';
            }
        }

        function saveContent(status) {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            if (!editor) {
                alert('Editor not initialized');
                return;
            }

            // Get components and styles
            const components = editor.getComponents();
            let css = editor.getCss();

            console.log('Number of components:', components.length);

            // Log all components to find the body
            components.forEach((comp, i) => {
                console.log(`Component ${i}: name=${comp.getName()}, isRoot=${comp.isRoot}, type=${comp.get('type')}`);
                const style = comp.getStyle();
                if (style && Object.keys(style).length > 0) {
                    console.log(`  Styles:`, style);
                }
            });

            // Extract wrapper styles from CSS and apply to body
            // The wrapper is rendered as a div with a unique ID and styled separately
            // We need to find the wrapper's ID and extract its background-color for the body
            let wrapperBgColor = null;

            // Find the frame's wrapper element (it's the one inside the body with class gjs-selected or similar)
            const frame = document.querySelector('iframe[data-gjs]') || document.querySelector('iframe.gjs-frame');
            if (frame && frame.contentDocument) {
                const wrapperEl = frame.contentDocument.body.querySelector('[data-gjs-type="wrapper"]');
                if (wrapperEl) {
                    const wrapperId = wrapperEl.id;
                    console.log('Found wrapper element with ID:', wrapperId);

                    // Extract wrapper's CSS rule
                    const wrapperCssRegex = new RegExp(`#${wrapperId}\\s*{[^}]*background-color:\\s*([^;!]+)[^}]*}`, 'i');
                    const wrapperMatch = css.match(wrapperCssRegex);
                    if (wrapperMatch) {
                        wrapperBgColor = wrapperMatch[1].trim();
                        console.log('Extracted wrapper background color:', wrapperBgColor);
                    }
                }
            }

            // If we found a wrapper background color, update the body CSS to include it
            if (wrapperBgColor) {
                // Remove existing body background-color if present and add the wrapper's color
                css = css.replace(/body\s*{[^}]*}/, (match) => {
                    // Remove old background-color and add new one
                    let newBodyRule = match.replace(/background-color:[^;]+;?/i, '');
                    // Remove trailing semicolon before closing brace
                    newBodyRule = newBodyRule.replace(/;\s*}/, ' }');
                    // Add the wrapper's background color before closing brace
                    newBodyRule = newBodyRule.replace(/\s*}/, `background-color: ${wrapperBgColor} !important; }`);
                    return newBodyRule;
                });
                console.log('Updated body CSS with wrapper background color');
            }
            components.forEach((comp, i) => {
                console.log(`Component ${i}:`, comp.getName(), 'HTML:', comp.toHTML().substring(0, 100));
            });

            console.log('CSS from editor.getCss():', css);
            console.log('CSS length:', css ? css.length : 0);

            let html = '';

            // Render components to HTML
            components.forEach(comp => {
                html += comp.toHTML();
            });

            // Add styles
            if (css) {
                html += '<style>' + css + '</style>';
            }

            console.log('Final HTML being saved:', html.substring(0, 200));
            console.log('Total HTML length:', html ? html.length : 0);

            // Debug: Check for body background in CSS
            if (css) {
                const bodyBgMatch = css.match(/body\s*{[^}]*background[^}]*}/i);
                if (bodyBgMatch) {
                    console.log('Found body background CSS:', bodyBgMatch[0]);
                } else {
                    console.log('No body background found in CSS');
                }
            }

            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt or '' }}',
                content: html,
                hero_image: '{{ post.hero_image or '' }}',
                template: '{{ post.template or 1 }}',
                status: status
            });

            const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;

            console.log('Saving to:', endpoint);
            console.log('Title:', title);
            console.log('Status:', status);
            console.log('CSRF Token:', csrfToken ? 'present' : 'missing');
            console.log('Form data keys:', Array.from(formData.keys()));

            console.log('Sending fetch request to:', endpoint);
            console.log('Content size:', html.length, 'bytes');
            console.log('Total form data size:', formData.toString().length, 'bytes');

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 second timeout

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'X-CSRF-Token': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString(),
                signal: controller.signal
            })
            .then(res => {
                clearTimeout(timeoutId);
                console.log('Fetch response received! Status:', res.status);
                if (!res.ok) {
                    return res.text().then(text => {
                        throw new Error(`Save failed (${res.status}): ${text.substring(0, 200)}`);
                    });
                }
                return res.text();
            })
            .then(() => {
                console.log('Save successful, redirecting...');
                window.location.href = '/admin#blog';
            })
            .catch(err => {
                clearTimeout(timeoutId);
                console.error('Fetch error:', err);
                if (err.name === 'AbortError') {
                    alert('Save took too long and timed out. Content may be too large.');
                } else {
                    alert('Error: ' + err.message);
                }
            });
        }

        function saveDraft() {
            saveContent('draft');
        }

        function publishPost() {
            saveContent('published');
        }

        function savePost() {
            publishPost();
        }

        function goBack() {
            window.location.href = '/admin#blog';
        }

        function undo() {
            if (editor) {
                editor.UndoManager.undo();
            }
        }

        function redo() {
            if (editor) {
                editor.UndoManager.redo();
            }
        }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEditor);
        } else {
            initEditor();
        }
    </script>
</body>
</html>
