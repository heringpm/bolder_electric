<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Bolder Electric</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='js/grapes.min.css') }}">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        .top-bar {
            background: #111;
            border-bottom: 1px solid rgba(241,186,32,0.22);
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 1000;
        }

        .title-input {
            font-size: 18px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: #f5f3ef;
            flex: 1;
            padding: 8px;
        }

        .title-input:focus { outline: none; color: #f1ba20; }

        .btn {
            padding: 8px 16px;
            border: 1px solid rgba(241,186,32,0.22);
            background: rgba(241,186,32,0.12);
            color: #f1ba20;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        #editor {
            height: calc(100vh - 60px);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title or '' }}">
        <button class="btn" onclick="goBack()">← Discard</button>
        <button class="btn primary" onclick="savePost()">Save & Publish</button>
    </div>

    <div id="editor"></div>

    <script src="{{ url_for('static', filename='js/grapes.min.js') }}"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let editor = null;
        const maxWaitTime = 5000;
        const startTime = Date.now();

        function initEditor() {
            if (typeof grapesjs === 'undefined') {
                if (Date.now() - startTime < maxWaitTime) {
                    setTimeout(initEditor, 100);
                    return;
                }
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: Failed to load editor library.</p>';
                return;
            }

            try {
                editor = grapesjs.init({
                    container: '#editor',
                    fromElement: false,
                    height: '100%',
                    width: '100%',
                    storageManager: false,
                    undoManager: { trackChanges: true },
                    blockManager: {
                        blocks: [
                            {
                                id: 'heading1',
                                label: 'Heading 1',
                                content: '<h1 style="font-size: 36px; font-weight: bold; margin: 20px 0;">Your Heading Here</h1>',
                                category: 'Typography'
                            },
                            {
                                id: 'heading2',
                                label: 'Heading 2',
                                content: '<h2 style="font-size: 28px; font-weight: bold; margin: 16px 0;">Your Subheading</h2>',
                                category: 'Typography'
                            },
                            {
                                id: 'text',
                                label: 'Paragraph',
                                content: '<p style="font-size: 16px; line-height: 1.6; margin: 12px 0;">Add your text here. You can format it, change colors, and adjust styling.</p>',
                                category: 'Basic'
                            },
                            {
                                id: 'image',
                                label: 'Image',
                                content: '<img src="https://via.placeholder.com/600x400" style="width:100%; border-radius: 8px;">',
                                category: 'Media'
                            },
                            {
                                id: 'button',
                                label: 'Button',
                                content: '<a href="#" style="display: inline-block; background: #f1ba20; color: #0a0a0a; padding: 12px 30px; border-radius: 4px; text-decoration: none; font-weight: bold; margin: 10px 0;">Click Me</a>',
                                category: 'Interactive'
                            },
                            {
                                id: 'divider',
                                label: 'Divider',
                                content: '<hr style="margin: 40px 0; border: none; border-top: 1px solid #ddd;">',
                                category: 'Layout'
                            },
                            {
                                id: 'section-two-col',
                                label: 'Two Columns',
                                content: '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px; background: #f5f5f5; border-radius: 8px;"><h3>Column 1</h3><p>Add content here</p></div><div style="padding: 20px; background: #f5f5f5; border-radius: 8px;"><h3>Column 2</h3><p>Add content here</p></div></div>',
                                category: 'Layout'
                            },
                            {
                                id: 'section-three-col',
                                label: 'Three Columns',
                                content: '<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 20px 0;"><div style="padding: 15px; background: #f5f5f5; border-radius: 8px;"><p>Column 1</p></div><div style="padding: 15px; background: #f5f5f5; border-radius: 8px;"><p>Column 2</p></div><div style="padding: 15px; background: #f5f5f5; border-radius: 8px;"><p>Column 3</p></div></div>',
                                category: 'Layout'
                            },
                            {
                                id: 'card',
                                label: 'Card',
                                content: '<div style="background: white; border: 1px solid #ddd; border-radius: 8px; padding: 30px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"><h3 style="margin-top: 0;">Card Title</h3><p style="color: #666;">Add your card content here.</p></div>',
                                category: 'Layout'
                            },
                            {
                                id: 'spacer',
                                label: 'Spacer',
                                content: '<div style="height: 40px;"></div>',
                                category: 'Layout'
                            }
                        ]
                    }
                });

                // Load existing content
                if (postContent && postContent.trim()) {
                    try {
                        editor.setComponents(postContent);
                    } catch (e) {
                        console.log('Could not parse existing content');
                    }
                }

                console.log('Editor initialized successfully');
            } catch (e) {
                console.error('Error initializing editor:', e);
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: ' + e.message + '</p>';
            }
        }

        function savePost() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            if (!editor) {
                alert('Editor not initialized');
                return;
            }

            const html = editor.getHtml();
            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt or '' }}',
                content: html,
                hero_image: '{{ post.hero_image or '' }}',
                template: '{{ post.template or 1 }}',
                status: 'published'
            });

            const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'X-CSRF-Token': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            })
            .then(res => {
                if (!res.ok) throw new Error('Save failed');
                window.location.href = '/admin#blog';
            })
            .catch(err => alert('Error: ' + err.message));
        }

        function goBack() {
            if (confirm('Discard all changes?')) {
                window.location.href = '/admin#blog';
            }
        }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEditor);
        } else {
            initEditor();
        }
    </script>
</body>
</html>
