<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor | Bolder Electric Admin</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #111;
            --panel2: #161616;
            --line: rgba(241,186,32,0.22);
            --gold: #f1ba20;
            --text: #f5f3ef;
            --muted: rgba(245,243,239,0.6);
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
        input, button, textarea, select { font-family: inherit; }

        .container { display: flex; height: 100vh; flex-direction: column; }
        .top-bar {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .title-input {
            font-size: 20px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: var(--text);
            flex: 1;
        }

        .title-input:focus { outline: none; color: var(--gold); }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--line);
            background: rgba(241,186,32,0.12);
            color: var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        .editor-wrapper { display: flex; flex: 1; overflow: hidden; }

        .left-panel {
            width: 240px;
            background: var(--panel2);
            border-right: 1px solid var(--line);
            overflow-y: auto;
            padding: 16px;
        }

        .panel-section {
            margin-bottom: 24px;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background: rgba(241,186,32,0.15);
            border: 1px solid rgba(241,186,32,0.3);
            color: var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .add-btn:hover { background: rgba(241,186,32,0.25); }

        .canvas {
            flex: 1;
            background: linear-gradient(135deg, rgba(241,186,32,0.02) 0%, transparent 100%);
            overflow-y: auto;
            padding: 40px;
        }

        .canvas-content {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section {
            background: var(--panel);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: move;
            transition: all 0.2s;
            position: relative;
        }

        .section:hover { border-color: var(--gold); background: rgba(241,186,32,0.05); }
        .section.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(241,186,32,0.2); }
        .section.drag-over { border-color: var(--gold); background: rgba(241,186,32,0.1); }

        .section-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            display: none;
            gap: 4px;
        }

        .section:hover .section-overlay { display: flex; }

        .overlay-btn {
            padding: 6px 10px;
            background: rgba(241,186,32,0.15);
            border: 1px solid rgba(241,186,32,0.3);
            color: var(--gold);
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        .overlay-btn:hover { background: rgba(241,186,32,0.25); }
        .overlay-btn.delete { color: #e05252; border-color: rgba(224,82,82,0.3); background: rgba(224,82,82,0.05); }
        .overlay-btn.delete:hover { background: rgba(224,82,82,0.15); }

        .text-content {
            color: var(--text);
            line-height: 1.6;
            min-height: 40px;
        }

        .text-content[contenteditable]:focus { outline: none; background: rgba(241,186,32,0.05); border-radius: 4px; padding: 4px; }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 8px;
        }

        .right-panel {
            width: 300px;
            background: var(--panel2);
            border-left: 1px solid var(--line);
            overflow-y: auto;
            padding: 16px;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 6px;
            display: block;
        }

        .control-input {
            width: 100%;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--text);
        }

        .control-input:focus { outline: none; border-color: var(--gold); }

        .width-btn {
            padding: 6px;
            margin: 2px;
            background: rgba(241,186,32,0.1);
            border: 1px solid rgba(241,186,32,0.2);
            color: var(--muted);
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .width-btn.active { background: rgba(241,186,32,0.25); color: var(--gold); border-color: var(--gold); }

        .formatting-toolbar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .format-btn {
            padding: 6px 8px;
            background: rgba(241,186,32,0.1);
            border: 1px solid rgba(241,186,32,0.2);
            color: var(--muted);
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .format-btn:hover { background: rgba(241,186,32,0.2); }
        .format-btn.active { background: rgba(241,186,32,0.25); color: var(--gold); }

        .color-picker { width: 100%; height: 36px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="title-area">
                <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title }}">
            </div>
            <button class="btn" onclick="goBack()">← Discard</button>
            <button class="btn primary" onclick="savePost()">Save & Publish</button>
        </div>

        <div class="editor-wrapper">
            <!-- Left Panel: Add Blocks -->
            <div class="left-panel">
                <div class="panel-section">
                    <div class="panel-title">Add Blocks</div>
                    <button class="add-btn" onclick="addTextSection()">+ Text</button>
                    <button class="add-btn" onclick="addImageSection()">+ Image</button>
                </div>
            </div>

            <!-- Canvas: Visual Editor -->
            <div class="canvas">
                <div class="canvas-content" id="canvas"></div>
            </div>

            <!-- Right Panel: Controls -->
            <div class="right-panel">
                <div id="controls">
                    <p style="color: var(--muted); font-size: 12px;">Click a section to edit</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let sections = [];
        let selectedId = null;
        let sectionIdCounter = 0;

        // Parse existing content
        function parseContent() {
            const div = document.createElement('div');
            div.innerHTML = postContent;

            div.childNodes.forEach(node => {
                if (node.nodeType !== 1) return;

                if (node.tagName === 'P') {
                    sections.push({
                        id: sectionIdCounter++,
                        type: 'text',
                        content: node.innerHTML,
                        width: 'full',
                        padding: 16,
                        fontSize: 16,
                        color: '#f5f3ef'
                    });
                } else if (node.tagName === 'IMG') {
                    sections.push({
                        id: sectionIdCounter++,
                        type: 'image',
                        src: node.src,
                        alt: node.alt || 'Image',
                        width: 'full',
                        padding: 16,
                        height: 300
                    });
                }
            });

            if (sections.length === 0) {
                sections.push({
                    id: sectionIdCounter++,
                    type: 'text',
                    content: '<p>Start editing...</p>',
                    width: 'full',
                    padding: 16,
                    fontSize: 16,
                    color: '#f5f3ef'
                });
            }
        }

        function addTextSection() {
            sections.push({
                id: sectionIdCounter++,
                type: 'text',
                content: '<p>New text section</p>',
                width: 'full',
                padding: 16,
                fontSize: 16,
                color: '#f5f3ef'
            });
            render();
        }

        function addImageSection() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                fetch('/admin/blog/upload-image', {
                    method: 'POST',
                    headers: { 'X-CSRF-Token': csrfToken },
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    sections.push({
                        id: sectionIdCounter++,
                        type: 'image',
                        src: data.url,
                        alt: 'Image',
                        width: 'full',
                        padding: 16,
                        height: 300
                    });
                    render();
                })
                .catch(err => alert('Error uploading image'));
            };
            input.click();
        }

        function selectSection(id) {
            selectedId = id;
            render();
        }

        function deleteSection(id) {
            sections = sections.filter(s => s.id !== id);
            selectedId = null;
            render();
        }

        function updateSectionWidth(id, width) {
            const section = sections.find(s => s.id === id);
            if (section) section.width = width;
            render();
        }

        function updateSectionPadding(id, padding) {
            const section = sections.find(s => s.id === id);
            if (section) section.padding = parseInt(padding);
            render();
        }

        function updateTextContent(id, html) {
            const section = sections.find(s => s.id === id);
            if (section) section.content = html;
        }

        function updateFontSize(id, size) {
            const section = sections.find(s => s.id === id);
            if (section) section.fontSize = parseInt(size);
            render();
        }

        function updateTextColor(id, color) {
            const section = sections.find(s => s.id === id);
            if (section) section.color = color;
            render();
        }

        function updateImageHeight(id, height) {
            const section = sections.find(s => s.id === id);
            if (section) section.height = parseInt(height);
            render();
        }

        function render() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = sections.map(section => {
                const isSelected = section.id === selectedId;
                const width = section.width === 'full' ? '100%' : (section.width === 'half' ? '50%' : '100%');

                return `
                    <div class="section ${isSelected ? 'selected' : ''}" onclick="selectSection(${section.id})" draggable="true">
                        <div class="section-overlay">
                            <button class="overlay-btn delete" onclick="deleteSection(${section.id}); return false;">✕</button>
                        </div>
                        ${section.type === 'text' ? `
                            <div class="text-content" contenteditable="true" onblur="updateTextContent(${section.id}, this.innerHTML)" style="font-size: ${section.fontSize}px; color: ${section.color}; padding: ${section.padding}px;">
                                ${section.content}
                            </div>
                        ` : `
                            <img src="${section.src}" alt="${section.alt}" style="width: 100%; height: ${section.height}px; object-fit: cover; border-radius: 4px; padding: ${section.padding}px;">
                        `}
                    </div>
                `;
            }).join('');

            // Render controls
            const controls = document.getElementById('controls');
            const selected = sections.find(s => s.id === selectedId);

            if (selected) {
                controls.innerHTML = `
                    <div class="control-group">
                        <label class="control-label">Width</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <button class="width-btn ${selected.width === 'full' ? 'active' : ''}" onclick="updateSectionWidth(${selected.id}, 'full')">Full</button>
                            <button class="width-btn ${selected.width === 'half' ? 'active' : ''}" onclick="updateSectionWidth(${selected.id}, 'half')">Half</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Padding (px)</label>
                        <input type="range" min="0" max="60" value="${selected.padding}" class="control-input" onchange="updateSectionPadding(${selected.id}, this.value)">
                        <span style="font-size: 11px; color: var(--muted);">${selected.padding}px</span>
                    </div>
                    ${selected.type === 'text' ? `
                        <div class="control-group">
                            <label class="control-label">Font Size (px)</label>
                            <input type="range" min="12" max="48" value="${selected.fontSize}" class="control-input" onchange="updateFontSize(${selected.id}, this.value)">
                            <span style="font-size: 11px; color: var(--muted);">${selected.fontSize}px</span>
                        </div>
                        <div class="control-group">
                            <label class="control-label">Text Color</label>
                            <input type="color" value="${selected.color}" class="control-input color-picker" onchange="updateTextColor(${selected.id}, this.value)">
                        </div>
                    ` : `
                        <div class="control-group">
                            <label class="control-label">Height (px)</label>
                            <input type="range" min="100" max="600" value="${selected.height}" class="control-input" onchange="updateImageHeight(${selected.id}, this.value)">
                            <span style="font-size: 11px; color: var(--muted);">${selected.height}px</span>
                        </div>
                    `}
                `;
            }
        }

        function savePost() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            const html = sections.map(section => {
                if (section.type === 'text') {
                    return `<p style="font-size:${section.fontSize}px;color:${section.color};padding:${section.padding}px;">${section.content}</p>`;
                } else {
                    return `<img src="${section.src}" alt="${section.alt}" style="width:100%;height:${section.height}px;object-fit:cover;border-radius:4px;padding:${section.padding}px;">`;
                }
            }).join('\n');

            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt }}',
                content: html,
                hero_image: '{{ post.hero_image }}',
                template: '{{ post.template }}',
                status: 'published'
            });

            fetch(`/admin/blog/${postId}/edit`, {
                method: 'POST',
                headers: { 'X-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(() => window.location.href = '/admin#blog')
            .catch(err => alert('Error saving post'));
        }

        function goBack() {
            if (confirm('Discard all changes?')) {
                window.location.href = '/admin#blog';
            }
        }

        parseContent();
        render();
    </script>
</body>
</html>
