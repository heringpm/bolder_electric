<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor | Bolder Electric Admin</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --panel: #111; --panel2: #161616;
            --line: rgba(241,186,32,0.22); --gold: #f1ba20;
            --text: #f5f3ef; --muted: rgba(245,243,239,0.6);
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: "Barlow Condensed", Arial, sans-serif; }
        a { color: inherit; text-decoration: none; }

        .top-bar {
            padding: 16px 28px; background: var(--panel); border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center;
        }
        .title-area {
            flex: 1;
        }
        .title-input {
            font-size: 24px; font-weight: bold; background: transparent; border: none;
            color: var(--text); font-family: "Bebas Neue", Arial, sans-serif; letter-spacing: 0.06em;
            margin-bottom: 8px; width: 100%;
        }
        .title-input:focus { outline: none; color: var(--gold); }
        .slug-input {
            font-size: 13px; background: transparent; border: 1px solid var(--line);
            color: var(--muted); padding: 6px 8px; border-radius: 4px; width: 300px;
            font-family: monospace;
        }
        .slug-input:focus { outline: none; border-color: var(--gold); color: var(--text); }

        .top-actions {
            display: flex; gap: 12px; align-items: center;
        }
        .btn-small {
            padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line);
            background: rgba(241,186,32,0.12); color: var(--gold); cursor: pointer;
            font-family: "Bebas Neue", Arial, sans-serif; font-size: 13px;
        }
        .btn-small:hover { border-color: rgba(241,186,32,0.5); }
        .status-toggle {
            display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 6px;
            padding: 4px; background: rgba(0,0,0,0.2);
        }
        .status-btn {
            padding: 6px 12px; border: none; background: transparent; color: var(--muted);
            cursor: pointer; font-size: 12px; border-radius: 4px; font-family: inherit;
        }
        .status-btn.active {
            background: rgba(241,186,32,0.15); color: var(--gold);
        }

        .main-content {
            display: flex; flex: 1; overflow: hidden;
        }

        .canvas-area {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }

        .canvas {
            flex: 1; overflow-y: auto; padding: 40px 20px; background: rgba(0,0,0,0.3);
        }

        .canvas-content {
            max-width: 900px; margin: 0 auto; background: var(--panel); border-radius: 10px;
            padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .layout-row {
            display: grid; gap: 16px; margin-bottom: 20px; position: relative;
        }
        .layout-row.cols-1 { grid-template-columns: 1fr; }
        .layout-row.cols-2 { grid-template-columns: 1fr 1fr; }

        .layout-block {
            position: relative; cursor: grab; padding: 16px;
            border: 2px solid transparent; border-radius: 8px; transition: all 0.2s;
            min-height: 60px; display: flex; flex-direction: column;
            background: rgba(241,186,32,0.03);
        }
        .layout-block:hover { border-color: rgba(241,186,32,0.3); background: rgba(241,186,32,0.06); }
        .layout-block.selected { border-color: var(--gold); background: rgba(241,186,32,0.1); }
        .layout-block.dragging { opacity: 0.5; }

        .block-content {
            flex: 1; line-height: 1.6; word-wrap: break-word;
        }
        .block-content p { margin: 0 0 12px 0; }
        .block-content p:last-child { margin-bottom: 0; }
        .block-content img {
            max-width: 100%; height: auto; border-radius: 6px; display: block;
        }

        .block-overlay {
            position: absolute; top: 8px; right: 8px; display: none; gap: 4px; z-index: 10;
            flex-wrap: wrap;
        }
        .layout-block:hover .block-overlay { display: flex; }
        .block-btn {
            padding: 4px 8px; background: rgba(241,186,32,0.15); color: var(--gold);
            border: 1px solid rgba(241,186,32,0.3); border-radius: 4px; cursor: pointer;
            font-family: inherit; font-size: 11px; white-space: nowrap;
        }
        .block-btn:hover { background: rgba(241,186,32,0.25); }
        .block-btn.delete { color: #e05252; border-color: rgba(224,82,82,0.3); background: rgba(224,82,82,0.05); }
        .block-btn.delete:hover { background: rgba(224,82,82,0.1); }

        .editor-panel {
            width: 380px; background: var(--panel2); border-left: 1px solid var(--line);
            padding: 20px; overflow-y: auto; font-size: 13px;
        }

        .control-group {
            margin-bottom: 24px;
        }
        .control-label {
            font-size: 11px; color: var(--gold); text-transform: uppercase; font-weight: bold;
            margin-bottom: 10px; display: block;
        }
        .control-input {
            width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--line); border-radius: 6px; color: var(--text);
            font-family: inherit; font-size: 13px;
        }
        .control-input:focus { outline: none; border-color: var(--gold); }

        .quill-wrap {
            background: rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden;
            max-height: 400px;
        }
        .ql-toolbar { background: var(--panel2); border: 1px solid var(--line); }
        .ql-container { background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-top: none; }
        .ql-editor { color: var(--text); font-family: inherit; }

        .format-buttons {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        .fmt-btn {
            padding: 6px; background: rgba(241,186,32,0.1); border: 1px solid rgba(241,186,32,0.3);
            border-radius: 4px; color: var(--gold); cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .fmt-btn:hover { background: rgba(241,186,32,0.15); }
        .fmt-btn.active { background: rgba(241,186,32,0.25); }

        .align-buttons {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
        }
        .align-btn {
            padding: 6px; background: rgba(241,186,32,0.1); border: 1px solid rgba(241,186,32,0.3);
            border-radius: 4px; color: var(--muted); cursor: pointer; font-size: 11px;
        }
        .align-btn.active { background: rgba(241,186,32,0.25); color: var(--gold); }

        .slider-group {
            display: flex; gap: 8px; align-items: center;
        }
        .slider-group input[type="range"] {
            flex: 1; height: 4px; background: rgba(241,186,32,0.2); border-radius: 2px;
            -webkit-appearance: none; appearance: none;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: var(--gold); cursor: pointer;
        }
        .slider-group input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%; background: var(--gold);
            cursor: pointer; border: none;
        }
        .slider-value {
            min-width: 40px; text-align: right; color: var(--gold); font-size: 12px;
        }

        .bottom-bar {
            padding: 16px 28px; background: var(--panel); border-top: 1px solid var(--line);
            display: flex; gap: 12px; justify-content: center;
        }
        .btn {
            padding: 12px 28px; border-radius: 8px; border: 1px solid var(--line);
            background: rgba(241,186,32,0.12); color: var(--gold); font-family: "Bebas Neue", Arial, sans-serif;
            font-size: 16px; letter-spacing: 0.06em; cursor: pointer;
        }
        .btn:hover { border-color: rgba(241,186,32,0.5); background: rgba(241,186,32,0.18); }
        .btn.back { background: var(--panel2); color: var(--text); border-color: var(--line); }
    </style>
</head>
<body>
    <div style="display: flex; flex-direction: column; height: 100vh;">
        <!-- Top bar with title and controls -->
        <div class="top-bar">
            <div class="title-area">
                <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title }}">
                <input type="text" class="slug-input" id="slugInput" placeholder="URL slug" value="{{ post.slug }}">
            </div>
            <div class="top-actions">
                <div class="status-toggle">
                    <button class="status-btn {{ 'active' if post.status == 'draft' else '' }}" onclick="setStatus('draft')">Draft</button>
                    <button class="status-btn {{ 'active' if post.status == 'published' else '' }}" onclick="setStatus('published')">Published</button>
                </div>
                <span id="statusDisplay" style="color: var(--muted); font-size: 12px;">{{ post.status | capitalize }}</span>
            </div>
        </div>

        <!-- Main content area -->
        <div class="main-content">
            <!-- Canvas -->
            <div class="canvas-area">
                <div class="canvas">
                    <div class="canvas-content" id="canvas"></div>
                </div>
            </div>

            <!-- Editor panel -->
            <div class="editor-panel">
                <div class="control-group">
                    <span class="control-label">Click a block to edit</span>
                    <div id="selectedBlockInfo" style="color: var(--muted); font-size: 12px;">Text or Image</div>
                </div>
                <div id="editorControls"></div>
            </div>
        </div>

        <!-- Bottom action bar -->
        <div class="bottom-bar">
            <button class="btn back" onclick="goBack()">← Discard</button>
            <button class="btn" onclick="saveLayout()">Save & Publish</button>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let selectedBlockId = null;
        let blockIdCounter = 0;
        let draggedId = null;
        let rows = [];
        let currentStatus = '{{ post.status }}';

        function parseHTML(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            const blocks = [];

            div.childNodes.forEach(node => {
                if (node.nodeType === 3 && node.textContent.trim()) return;
                if (node.tagName === 'P' || node.tagName === 'IMG') {
                    const id = blockIdCounter++;
                    if (node.tagName === 'P') {
                        blocks.push({
                            id, type: 'text',
                            content: node.innerHTML,
                            fontSize: parseInt(node.style.fontSize) || 16,
                            align: node.style.textAlign || 'left',
                            bold: node.style.fontWeight === 'bold',
                            colSpan: 1
                        });
                    } else if (node.tagName === 'IMG') {
                        blocks.push({
                            id, type: 'image',
                            src: node.src,
                            alt: node.alt || 'Image',
                            maxWidth: parseInt(node.style.maxWidth) || 100,
                            align: 'center',
                            colSpan: 1
                        });
                    }
                }
            });
            return blocks;
        }

        let blocks = parseHTML(postContent);

        function initializeRows() {
            rows = [];
            blocks.forEach(block => {
                rows.push({ blocks: [block] });
            });
        }

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';

            rows.forEach((row, rowIdx) => {
                const rowEl = document.createElement('div');
                const colCount = row.blocks.reduce((sum, b) => sum + (b.colSpan || 1), 0);
                rowEl.className = `layout-row cols-${Math.min(colCount, 2)}`;

                row.blocks.forEach((block, colIdx) => {
                    const blockEl = createBlockElement(block, rowIdx, colIdx);
                    rowEl.appendChild(blockEl);
                });

                canvas.appendChild(rowEl);
            });
        }

        function createBlockElement(block, rowIdx, colIdx) {
            const blockEl = document.createElement('div');
            blockEl.className = 'layout-block';
            blockEl.dataset.blockId = block.id;
            if (selectedBlockId === block.id) blockEl.classList.add('selected');

            blockEl.draggable = true;
            blockEl.style.gridColumn = `span ${block.colSpan || 1}`;

            const content = document.createElement('div');
            content.className = 'block-content';

            if (block.type === 'text') {
                content.innerHTML = block.content;
                content.style.fontSize = block.fontSize + 'px';
                content.style.textAlign = block.align;
                if (block.bold) content.style.fontWeight = 'bold';
            } else if (block.type === 'image') {
                const img = document.createElement('img');
                img.src = block.src;
                img.alt = block.alt;
                img.style.maxWidth = block.maxWidth + '%';
                if (block.align === 'center') img.style.margin = '0 auto';
                content.appendChild(img);
            }

            const overlay = document.createElement('div');
            overlay.className = 'block-overlay';
            const hasNextInRow = colIdx < rows[rowIdx].blocks.length - 1;
            const nextIsText = hasNextInRow && rows[rowIdx].blocks[colIdx + 1].type === 'text' && block.type === 'text';

            overlay.innerHTML = `
                <button class="block-btn" onclick="selectBlock(${block.id})">Edit</button>
                ${block.colSpan < 2 ? `<button class="block-btn" onclick="resizeBlock(${block.id}, 2)">Widen</button>` : `<button class="block-btn" onclick="resizeBlock(${block.id}, 1)">Narrow</button>`}
                ${nextIsText ? `<button class="block-btn" style="background:rgba(108,180,255,0.1);color:#6cb4ff;border-color:rgba(108,180,255,0.3);" onclick="combineBlocks(${rowIdx}, ${colIdx})">Merge</button>` : ''}
                <button class="block-btn delete" onclick="deleteBlock(${block.id})">Remove</button>
            `;

            blockEl.appendChild(content);
            blockEl.appendChild(overlay);

            blockEl.addEventListener('click', () => selectBlock(block.id));

            blockEl.addEventListener('dragstart', (e) => {
                draggedId = block.id;
                blockEl.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });

            blockEl.addEventListener('dragend', () => blockEl.classList.remove('dragging'));
            blockEl.addEventListener('dragover', (e) => e.preventDefault());

            blockEl.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedId === null || draggedId === block.id) return;

                const draggedBlock = blocks.find(b => b.id === draggedId);
                const targetRow = rows[rowIdx];
                const draggedRow = rows.find(r => r.blocks.includes(draggedBlock));

                if (draggedRow) {
                    draggedRow.blocks = draggedRow.blocks.filter(b => b.id !== draggedId);
                    if (draggedRow.blocks.length === 0) rows = rows.filter(r => r !== draggedRow);
                }

                const insertIdx = targetRow.blocks.indexOf(block);
                if (insertIdx >= 0) targetRow.blocks.splice(insertIdx, 0, draggedBlock);
                else targetRow.blocks.push(draggedBlock);

                draggedId = null;
                renderCanvas();
            });

            return blockEl;
        }

        function selectBlock(blockId) {
            selectedBlockId = blockId;
            const block = blocks.find(b => b.id === blockId);
            document.getElementById('selectedBlockInfo').textContent = `${block.type === 'text' ? 'Text' : 'Image'} Block`;

            const controls = document.getElementById('editorControls');
            controls.innerHTML = '';

            if (block.type === 'text') {
                controls.innerHTML = `
                    <div class="control-group">
                        <label class="control-label">Content (HTML)</label>
                        <textarea id="textEditor" style="width:100%;height:200px;padding:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(241,186,32,0.3);border-radius:6px;color:#f5f3ef;font-family:monospace;font-size:12px;resize:vertical;" placeholder="Edit text here...">${block.content}</textarea>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Formatting</label>
                        <div class="format-buttons">
                            <button class="fmt-btn ${block.bold ? 'active' : ''}" onclick="toggleBold()"><strong>Bold</strong></button>
                        </div>
                        <label class="control-label" style="margin-top: 12px;">Alignment</label>
                        <div class="align-buttons">
                            <button class="align-btn ${block.align === 'left' ? 'active' : ''}" onclick="setAlign('left')">Left</button>
                            <button class="align-btn ${block.align === 'center' ? 'active' : ''}" onclick="setAlign('center')">Center</button>
                            <button class="align-btn ${block.align === 'right' ? 'active' : ''}" onclick="setAlign('right')">Right</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Font Size</label>
                        <div class="slider-group">
                            <input type="range" min="12" max="48" value="${block.fontSize}" oninput="updateFontSize(this.value)">
                            <span class="slider-value">${block.fontSize}px</span>
                        </div>
                    </div>
                `;

                setTimeout(() => {
                    const textEditor = document.getElementById('textEditor');
                    if (textEditor) {
                        textEditor.addEventListener('input', () => {
                            block.content = textEditor.value;
                        });
                        textEditor.addEventListener('change', () => {
                            block.content = textEditor.value;
                        });
                        textEditor.focus();
                    }
                }, 50);
            } else if (block.type === 'image') {
                controls.innerHTML = `
                    <div class="control-group">
                        <label class="control-label">Image Width</label>
                        <div class="slider-group">
                            <input type="range" min="20" max="100" value="${block.maxWidth}" oninput="updateImageWidth(this.value)">
                            <span class="slider-value">${block.maxWidth}%</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Alignment</label>
                        <div class="align-buttons">
                            <button class="align-btn ${block.align === 'left' ? 'active' : ''}" onclick="setImageAlign('left')">Left</button>
                            <button class="align-btn ${block.align === 'center' ? 'active' : ''}" onclick="setImageAlign('center')">Center</button>
                            <button class="align-btn ${block.align === 'right' ? 'active' : ''}" onclick="setImageAlign('right')">Right</button>
                        </div>
                    </div>
                `;
            }

            renderCanvas();
        }

        function resizeBlock(blockId, newColSpan) {
            const block = blocks.find(b => b.id === blockId);
            block.colSpan = newColSpan;
            renderCanvas();
        }

        function combineBlocks(rowIdx, colIdx) {
            const row = rows[rowIdx];
            if (colIdx < row.blocks.length - 1) {
                const current = row.blocks[colIdx];
                const next = row.blocks[colIdx + 1];
                current.content += '<br><br>' + next.content;
                row.blocks.splice(colIdx + 1, 1);
                blocks = blocks.filter(b => b.id !== next.id);
                renderCanvas();
            }
        }

        function updateFontSize(val) {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.fontSize = parseInt(val);
            renderCanvas();
        }

        function updateImageWidth(val) {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.maxWidth = parseInt(val);
            renderCanvas();
        }

        function toggleBold() {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.bold = !block.bold;
            selectBlock(selectedBlockId);
            renderCanvas();
        }

        function setAlign(align) {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.align = align;
            selectBlock(selectedBlockId);
            renderCanvas();
        }

        function setImageAlign(align) {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.align = align;
            selectBlock(selectedBlockId);
            renderCanvas();
        }

        function setStatus(status) {
            currentStatus = status;
            document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('statusDisplay').textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        function deleteBlock(blockId) {
            blocks = blocks.filter(b => b.id !== blockId);
            rows = rows.map(r => ({ blocks: r.blocks.filter(b => b.id !== blockId) })).filter(r => r.blocks.length > 0);
            selectedBlockId = null;
            renderCanvas();
        }

        function saveLayout() {
            const title = document.getElementById('titleInput').value.trim();
            const slug = document.getElementById('slugInput').value.trim();

            if (!title) {
                alert('Please enter a title');
                return;
            }

            const html = blocks.map(block => {
                if (block.type === 'text') {
                    return `<p style="text-align:${block.align};font-size:${block.fontSize}px;${block.bold ? 'font-weight:bold;' : ''}">${block.content}</p>`;
                } else {
                    return `<img src="${block.src}" alt="${block.alt}" style="max-width:${block.maxWidth}%;height:auto;${block.align === 'center' ? 'display:block;margin:0 auto;' : ''}border-radius:8px;">`;
                }
            }).join('\n');

            const formData = new URLSearchParams({
                title, slug,
                excerpt: '{{ post.excerpt }}',
                content: html,
                hero_image: '{{ post.hero_image }}',
                template: '{{ post.template }}',
                status: currentStatus
            });

            fetch(`/admin/blog/${postId}/edit`, {
                method: 'POST',
                headers: { 'X-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(() => {
                window.location.href = '/admin#blog';
            }).catch(err => console.error('Error:', err));
        }

        function goBack() {
            if (confirm('Discard all changes?')) {
                window.location.href = '/admin#blog';
            }
        }

        initializeRows();
        renderCanvas();
    </script>
</body>
</html>
