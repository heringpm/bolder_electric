<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Bolder Electric</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='js/grapes.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        .top-bar {
            background: #111;
            border-bottom: 1px solid rgba(241,186,32,0.22);
            padding: 12px 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            height: 60px;
            z-index: 1000;
        }

        .title-input {
            font-size: 16px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: #f5f3ef;
            flex: 1;
            padding: 8px;
        }

        .title-input:focus { outline: none; color: #f1ba20; }

        .btn {
            padding: 8px 14px;
            border: 1px solid rgba(241,186,32,0.22);
            background: rgba(241,186,32,0.12);
            color: #f1ba20;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        .editor-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        #editor {
            width: 100%;
            height: 100%;
        }

        .gjs-blocks-cs {
            padding: 10px;
        }

        .gjs-block-category {
            margin-bottom: 20px;
        }

        .gjs-title {
            padding: 10px;
            background: #f5f5f5;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gjs-block {
            padding: 10px;
            margin-bottom: 8px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: move;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .gjs-block:hover {
            background: #f1f1f1;
            border-color: #f1ba20;
        }

        .gjs-block__media {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gjs-block__media svg {
            width: 28px;
            height: 28px;
            color: #666;
        }

        .gjs-block-label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        #editor {
            flex: 1;
        }

        .gjs-cv-canvas {
            background: white;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="btn" onclick="goBack()">← Back</button>
        <div style="margin-left: 20px; display: flex; gap: 8px; border-left: 1px solid rgba(241,186,32,0.22); padding-left: 20px;">
            <button class="btn" onclick="undo()" title="Undo"><i class="fas fa-undo"></i></button>
            <button class="btn" onclick="redo()" title="Redo"><i class="fas fa-redo"></i></button>
        </div>
        <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title or '' }}">
        <button class="btn" onclick="saveDraft()">Save Draft</button>
        <button class="btn primary" onclick="publishPost()">Publish</button>
    </div>

    <div class="editor-container">
        <div id="editor"></div>
    </div>

    <script src="{{ url_for('static', filename='js/grapes.min.js') }}"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let editor = null;
        const maxWaitTime = 5000;
        const startTime = Date.now();

        function initEditor() {
            if (typeof grapesjs === 'undefined') {
                if (Date.now() - startTime < maxWaitTime) {
                    setTimeout(initEditor, 100);
                    return;
                }
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: Failed to load editor library.</p>';
                return;
            }

            try {
                editor = grapesjs.init({
                    container: '#editor',
                    fromElement: false,
                    height: '100%',
                    width: '100%',
                    storageManager: false,
                    undoManager: { trackChanges: true },
                    pageManager: {},
                    blockManager: {
                        blocks: [
                            { id: 'section-one-col', label: '1 Column', content: '<div style="display: grid; grid-template-columns: 1fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px;"><p>Column content</p></div></div>', category: 'Basic' },
                            { id: 'section-two-col', label: '2 Columns', content: '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px;"><p>Column 1</p></div><div style="padding: 20px;"><p>Column 2</p></div></div>', category: 'Basic' },
                            { id: 'section-three-col', label: '3 Columns', content: '<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 20px 0;"><div style="padding: 15px;"><p>Col 1</p></div><div style="padding: 15px;"><p>Col 2</p></div><div style="padding: 15px;"><p>Col 3</p></div></div>', category: 'Basic' },
                            { id: 'section-two-col-37', label: '2 Col 3/7', content: '<div style="display: grid; grid-template-columns: 3fr 7fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px;"><p>30%</p></div><div style="padding: 20px;"><p>70%</p></div></div>', category: 'Basic' },
                            { id: 'text', label: 'Text', content: '<p style="font-size: 16px; line-height: 1.6; margin: 12px 0;">Add your text content here.</p>', category: 'Basic' },
                            { id: 'link', label: 'Link', content: '<a href="#">Link text</a>', category: 'Basic' },
                            { id: 'image', label: 'Image', content: '<img src="https://via.placeholder.com/600x400" style="width:100%; height: auto;" />', category: 'Basic' },
                            { id: 'video', label: 'Video', content: '<iframe width="100%" height="400" style="border-radius: 8px;" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>', category: 'Basic' },
                            { id: 'map', label: 'Map', content: '<iframe width="100%" height="400" style="border: 1px solid #ccc;" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3024.1234567890!2d-74.00601234567890!3d40.71278901234567!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDQyJzQ2LjIiTiA3NMKwMDAnMjEuNiJX!5e0!3m2!1sen!2sus!4v1234567890" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>', category: 'Basic' },
                            { id: 'link-block', label: 'Link Block', content: '<a href="#" style="display: block; padding: 20px; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #333;">Link block with full area clickable</a>', category: 'Basic' },
                            { id: 'quote', label: 'Quote', content: '<blockquote style="border-left: 4px solid #f1ba20; padding-left: 20px; margin: 20px 0; font-style: italic; color: #666;"><p>"Your inspiring quote goes here"</p><p style="font-size: 14px;">— Attribution</p></blockquote>', category: 'Basic' },
                            { id: 'text-section', label: 'Text Section', content: '<section style="padding: 40px; background: #f9f9f9;"><h2 style="margin-bottom: 20px;">Section Title</h2><p style="line-height: 1.6; color: #333;">Section content with multiple lines of text can go here.</p></section>', category: 'Basic' },
                            { id: 'form', label: 'Form', content: '<form style="max-width: 500px;"><div style="margin-bottom: 15px;"><input type="text" placeholder="Name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" /></div><div style="margin-bottom: 15px;"><input type="email" placeholder="Email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" /></div><button type="submit" style="padding: 10px 20px; background: #f1ba20; color: #000; border: none; border-radius: 4px; cursor: pointer;">Submit</button></form>', category: 'Forms' },
                            { id: 'input', label: 'Input', content: '<input type="text" placeholder="Input field" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" />', category: 'Forms' },
                            { id: 'textarea', label: 'Textarea', content: '<textarea placeholder="Message" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; min-height: 120px;"></textarea>', category: 'Forms' },
                            { id: 'select', label: 'Select', content: '<select style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"><option>Choose an option</option><option>Option 1</option><option>Option 2</option></select>', category: 'Forms' },
                            { id: 'button', label: 'Button', content: '<button style="padding: 12px 30px; background: #f1ba20; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Click me</button>', category: 'Forms' },
                            { id: 'label', label: 'Label', content: '<label style="display: block; margin-bottom: 10px; font-weight: bold;">Label text</label>', category: 'Forms' },
                            { id: 'checkbox', label: 'Checkbox', content: '<div style="margin: 10px 0;"><input type="checkbox" id="cb1" /><label for="cb1" style="margin-left: 8px; display: inline;">Checkbox option</label></div>', category: 'Forms' },
                            { id: 'radio', label: 'Radio', content: '<div style="margin: 10px 0;"><input type="radio" id="r1" name="radio-group" /><label for="r1" style="margin-left: 8px; display: inline;">Radio option</label></div>', category: 'Forms' },
                            { id: 'countdown', label: 'Countdown', content: '<div style="display: inline-block; padding: 20px; background: #f1ba20; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold;">00:00:00</div>', category: 'Extra' },
                            { id: 'tabs', label: 'Tabs', content: '<div><div style="display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px;"><button style="padding: 10px 20px; background: none; border: none; font-weight: bold; cursor: pointer; border-bottom: 3px solid #f1ba20;">Tab 1</button><button style="padding: 10px 20px; background: none; border: none; cursor: pointer;">Tab 2</button></div><div>Tab 1 content</div></div>', category: 'Extra' },
                            { id: 'custom-code', label: 'Custom Code', content: '<div style="background: #f5f5f5; padding: 20px; border-radius: 4px; font-family: monospace;"><code>&lt;div&gt;Custom HTML code&lt;/div&gt;</code></div>', category: 'Extra' },
                            { id: 'tooltip', label: 'Tooltip', content: '<span style="position: relative; cursor: help; text-decoration: underline; border-bottom: 1px dotted #666;">Hover me<span style="position: absolute; background: #333; color: white; padding: 8px 12px; border-radius: 4px; white-space: nowrap; bottom: 125%; left: 50%; transform: translateX(-50%); display: none; font-size: 12px;">Tooltip text</span></span>', category: 'Extra' }
                        ]
                    },
                    deviceManager: {
                        devices: [
                            { name: 'Desktop', width: '' },
                            { name: 'Tablet', width: '768px', widthMedia: '768px' },
                            { name: 'Mobile', width: '375px', widthMedia: '375px' }
                        ]
                    }
                });

                if (postContent && postContent.trim()) {
                    try {
                        editor.setComponents(postContent);
                        console.log('Loaded content');

                        setTimeout(() => {
                            const styleMatch = postContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
                            if (styleMatch) {
                                const css = styleMatch[1];
                                const frame = document.querySelector('iframe[data-gjs]') || document.querySelector('iframe.gjs-frame');
                                if (frame && frame.contentDocument) {
                                    const oldStyle = frame.contentDocument.querySelector('style[data-custom-styles]');
                                    if (oldStyle) oldStyle.remove();
                                    const styleEl = frame.contentDocument.createElement('style');
                                    styleEl.setAttribute('data-custom-styles', 'true');
                                    styleEl.textContent = css;
                                    frame.contentDocument.head.appendChild(styleEl);
                                }
                            }
                        }, 200);
                    } catch (e) {
                        console.log('Could not parse existing content:', e);
                    }
                }

                console.log('Editor initialized');
            } catch (e) {
                console.error('Error initializing editor:', e);
            }
        }

        function saveContent(status) {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            if (!editor) {
                alert('Editor not initialized');
                return;
            }

            const components = editor.getComponents();
            let css = editor.getCss();
            let html = '';

            components.forEach(comp => {
                html += comp.toHTML();
            });

            if (css) {
                html += '<style>' + css + '</style>';
            }

            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt or '' }}',
                content: html,
                hero_image: '{{ post.hero_image or '' }}',
                template: '{{ post.template or 1 }}',
                status: status
            });

            const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 60000);

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'X-CSRF-Token': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString(),
                signal: controller.signal
            })
            .then(res => {
                clearTimeout(timeoutId);
                if (!res.ok) {
                    return res.text().then(text => {
                        throw new Error(`Save failed (${res.status}): ${text.substring(0, 200)}`);
                    });
                }
                return res.text();
            })
            .then(() => {
                window.location.href = '/admin#blog';
            })
            .catch(err => {
                clearTimeout(timeoutId);
                console.error('Fetch error:', err);
                if (err.name === 'AbortError') {
                    alert('Save took too long and timed out. Content may be too large.');
                } else {
                    alert('Error: ' + err.message);
                }
            });
        }

        function saveDraft() { saveContent('draft'); }
        function publishPost() { saveContent('published'); }
        function goBack() { window.location.href = '/admin#blog'; }
        function undo() { if (editor) editor.UndoManager.undo(); }
        function redo() { if (editor) editor.UndoManager.redo(); }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEditor);
        } else {
            initEditor();
        }
    </script>
</body>
</html>
