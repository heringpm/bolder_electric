<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Bolder Electric</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='js/grapes.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        .top-bar {
            background: #111;
            border-bottom: 1px solid rgba(241,186,32,0.22);
            padding: 12px 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            height: 60px;
            z-index: 1000;
        }

        .title-input {
            font-size: 16px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: #f5f3ef;
            flex: 1;
            padding: 8px;
        }

        .title-input:focus { outline: none; color: #f1ba20; }

        .btn {
            padding: 8px 14px;
            border: 1px solid rgba(241,186,32,0.22);
            background: rgba(241,186,32,0.12);
            color: #f1ba20;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        .editor-container {
            display: flex;
            height: calc(100vh - 60px);
            gap: 0;
        }

        .panels-container {
            display: flex;
            width: 100%;
        }

        .left-panel {
            width: 200px;
            background: #f9f9f9;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .editor-canvas {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-width: 400px;
        }

        .right-panel {
            width: 250px;
            background: #f9f9f9;
            border-left: 1px solid #ddd;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        #layers-panel {
            flex: 1;
            border-bottom: 1px solid #ddd;
            overflow-y: auto;
        }

        #styles-panel {
            flex: 1;
            overflow-y: auto;
        }

        .gjs-blocks-cs {
            padding: 10px;
        }

        .gjs-block-category {
            margin-bottom: 20px;
        }

        .gjs-title {
            padding: 10px;
            background: #f5f5f5;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gjs-block {
            padding: 10px;
            margin-bottom: 8px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: move;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .gjs-block:hover {
            background: #f1f1f1;
            border-color: #f1ba20;
        }

        .gjs-block__media {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gjs-block__media svg {
            width: 28px;
            height: 28px;
            color: #666;
        }

        .gjs-block-label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        #editor {
            flex: 1;
        }

        .gjs-cv-canvas {
            background: white;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="btn" onclick="goBack()">← Back</button>
        <div style="margin-left: 20px; display: flex; gap: 8px; border-left: 1px solid rgba(241,186,32,0.22); padding-left: 20px;">
            <button class="btn" onclick="undo()" title="Undo"><i class="fas fa-undo"></i></button>
            <button class="btn" onclick="redo()" title="Redo"><i class="fas fa-redo"></i></button>
        </div>
        <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title or '' }}">
        <button class="btn" onclick="saveDraft()">Save Draft</button>
        <button class="btn primary" onclick="publishPost()">Publish</button>
    </div>

    <div class="editor-container">
        <div class="left-panel" id="blocks-panel"></div>
        <div class="editor-canvas">
            <div id="editor"></div>
        </div>
        <div class="right-panel">
            <div id="layers-panel"></div>
            <div id="styles-panel"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/grapes.min.js') }}"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let editor = null;
        const maxWaitTime = 5000;
        const startTime = Date.now();

        function getSvgIcon(name) {
            const icons = {
                columns: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 20h8V4H2v16Zm-1 0V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1ZM13 20h8V4h-8v16Zm-1 0V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1Z"></path></svg>',
                text: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.5,4L19.66,8.35L18.7,8.61C18.25,7.74 17.79,6.87 17.26,6.43C16.73,6 16.11,6 15.5,6H13V16.5C13,17 13,17.5 13.33,17.75C13.67,18 14.33,18 15,18V19H9V18C9.67,18 10.33,18 10.67,17.75C11,17.5 11,17 11,16.5V6H8.5C7.89,6 7.27,6 6.74,6.43C6.21,6.87 5.75,7.74 5.3,8.61L4.34,8.35L5.5,4H18.5Z"></path></svg>',
                image: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M21,3H3C2,3 1,4 1,5V19A2,2 0 0,0 3,21H21C22,21 23,20 23,19V5C23,4 22,3 21,3M5,17L8.5,12.5L11,15.5L14.5,11L19,17H5Z"></path></svg>',
                video: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M10,15L15.19,12L10,9V15M21.56,7.17C21.69,7.64 21.78,8.27 21.84,9.07C21.91,9.87 21.94,10.56 21.94,11.16L22,12C22,14.19 21.84,15.8 21.56,16.83C21.31,17.73 20.73,18.31 19.83,18.56C19.36,18.69 18.5,18.78 17.18,18.84C15.88,18.91 14.69,18.94 13.59,18.94L12,19C7.81,19 5.2,18.84 4.17,18.56C3.27,18.31 2.69,17.73 2.44,16.83C2.31,16.36 2.22,15.73 2.16,14.93C2.09,14.13 2.06,13.44 2.06,12.84L2,12C2,9.81 2.16,8.2 2.44,7.17C2.69,6.27 3.27,5.69 4.17,5.44C4.64,5.31 5.5,5.22 6.82,5.16C8.12,5.09 9.31,5.06 10.41,5.06L12,5C16.19,5 18.8,5.16 19.83,5.44C20.73,5.69 21.31,6.27 21.56,7.17Z"></path></svg>',
                link: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3.9,12C3.9,10.29 5.29,8.9 7,8.9H11V7H7A5,5 0 0,0 2,12A5,5 0 0,0 7,17H11V15.1H7C5.29,15.1 3.9,13.71 3.9,12M8,13H16V11H8V13M17,7H13V8.9H17C18.71,8.9 20.1,10.29 20.1,12C20.1,13.71 18.71,15.1 17,15.1H13V17H17A5,5 0 0,0 22,12A5,5 0 0,0 17,7Z"></path></svg>',
                map: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.5,3L20.34,3.03L15,5.1L9,3L3.36,4.9C3.15,4.97 3,5.15 3,5.38V20.5A0.5,0.5 0 0,0 3.5,21L3.66,20.97L9,18.9L15,21L20.64,19.1C20.85,19.03 21,18.85 21,18.62V3.5A0.5,0.5 0 0,0 20.5,3M10,5.47L14,6.87V18.53L10,17.13V5.47M5,6.46L8,5.45V17.15L5,18.31V6.46M19,17.54L16,18.55V6.86L19,5.7V17.54Z"></path></svg>',
                quote: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M14,17H17L19,13V7H13V13H16M6,17H9L11,13V7H5V13H8L6,17Z"></path></svg>',
                form: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 5.5c0-.3-.5-.5-1.3-.5H3.4c-.8 0-1.3.2-1.3.5v3c0 .3.5.5 1.3.5h17.4c.8 0 1.3-.2 1.3-.5v-3zM21 8H3V6h18v2zM22 10.5c0-.3-.5-.5-1.3-.5H3.4c-.8 0-1.3.2-1.3.5v3c0 .3.5.5 1.3.5h17.4c.8 0 1.3-.2 1.3-.5v-3zM21 13H3v-2h18v2z"></path></svg>',
                input: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 9c0-.6-.5-1-1.3-1H3.4C2.5 8 2 8.4 2 9v6c0 .6.5 1 1.3 1h17.4c.8 0 1.3-.4 1.3-1V9zm-1 6H3V9h18v6z"></path></svg>',
                textarea: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 7.5c0-.9-.5-1.5-1.3-1.5H3.4C2.5 6 2 6.6 2 7.5v9c0 .9.5 1.5 1.3 1.5h17.4c.8 0 1.3-.6 1.3-1.5v-9zM21 17H3V7h18v10z"></path></svg>',
                select: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 9c0-.6-.5-1-1.3-1H3.4C2.5 8 2 8.4 2 9v6c0 .6.5 1 1.3 1h17.4c.8 0 1.3-.4 1.3-1V9zm-1 6H3V9h18v6z"></path></svg>',
                button: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 9c0-.6-.5-1-1.3-1H3.4C2.5 8 2 8.4 2 9v6c0 .6.5 1 1.3 1h17.4c.8 0 1.3-.4 1.3-1V9zm-1 6H3V9h18v6z"></path></svg>',
                checkbox: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 17l-5-5 1.41-1.42L10 14.17l7.59-7.59L19 8m0-5H5c-1.11 0-2 .89-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5a2 2 0 0 0-2-2z"></path></svg>',
                radio: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 20C16.4 20 20 16.4 20 12S16.4 4 12 4 4 7.6 4 12 7.6 20 12 20M12 2C17.5 2 22 6.5 22 12S17.5 22 12 22C6.5 22 2 17.5 2 12C2 6.5 6.5 2 12 2M12 7C9.24 7 7 9.24 7 12S9.24 17 12 17 17 14.76 17 12 14.76 7 12 7Z"></path></svg>',
                code: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M14.6 16.6l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4m-5.2 0L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4z"></path></svg>',
                box: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 20h20V4H2v16Zm-1 0V4a1 1 0 0 1 1-1h20a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1Z"></path></svg>'
            };
            return icons[name] || icons.box;
        }

        function initEditor() {
            if (typeof grapesjs === 'undefined') {
                if (Date.now() - startTime < maxWaitTime) {
                    setTimeout(initEditor, 100);
                    return;
                }
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: Failed to load editor library.</p>';
                return;
            }

            try {
                editor = grapesjs.init({
                    container: '#editor',
                    fromElement: false,
                    height: '100%',
                    width: '100%',
                    storageManager: false,
                    undoManager: { trackChanges: true },
                    pageManager: {},
                    blockManager: {
                        appendTo: '#blocks-panel',
                        blocks: [
                            { id: 'section-one-col', label: '<div class="gjs-block__media">' + getSvgIcon('box') + '</div><div class="gjs-block-label">1 Column</div>', content: '<div style="display: grid; grid-template-columns: 1fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px;"><p>Column content</p></div></div>', category: 'Basic' },
                            { id: 'section-two-col', label: '<div class="gjs-block__media">' + getSvgIcon('columns') + '</div><div class="gjs-block-label">2 Columns</div>', content: '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px;"><p>Column 1</p></div><div style="padding: 20px;"><p>Column 2</p></div></div>', category: 'Basic' },
                            { id: 'section-three-col', label: '<div class="gjs-block__media">' + getSvgIcon('columns') + '</div><div class="gjs-block-label">3 Columns</div>', content: '<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 20px 0;"><div style="padding: 15px;"><p>Col 1</p></div><div style="padding: 15px;"><p>Col 2</p></div><div style="padding: 15px;"><p>Col 3</p></div></div>', category: 'Basic' },
                            { id: 'section-two-col-37', label: '<div class="gjs-block__media">' + getSvgIcon('columns') + '</div><div class="gjs-block-label">2 Col 3/7</div>', content: '<div style="display: grid; grid-template-columns: 3fr 7fr; gap: 30px; margin: 20px 0;"><div style="padding: 20px;"><p>30%</p></div><div style="padding: 20px;"><p>70%</p></div></div>', category: 'Basic' },
                            { id: 'text', label: '<div class="gjs-block__media">' + getSvgIcon('text') + '</div><div class="gjs-block-label">Text</div>', content: '<p style="font-size: 16px; line-height: 1.6; margin: 12px 0;">Add your text content here.</p>', category: 'Basic' },
                            { id: 'link', label: '<div class="gjs-block__media">' + getSvgIcon('link') + '</div><div class="gjs-block-label">Link</div>', content: '<a href="#">Link text</a>', category: 'Basic' },
                            { id: 'image', label: '<div class="gjs-block__media">' + getSvgIcon('image') + '</div><div class="gjs-block-label">Image</div>', content: '<img src="https://via.placeholder.com/600x400" style="width:100%; height: auto;" />', category: 'Basic' },
                            { id: 'video', label: '<div class="gjs-block__media">' + getSvgIcon('video') + '</div><div class="gjs-block-label">Video</div>', content: '<iframe width="100%" height="400" style="border-radius: 8px;" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>', category: 'Basic' },
                            { id: 'map', label: '<div class="gjs-block__media">' + getSvgIcon('map') + '</div><div class="gjs-block-label">Map</div>', content: '<iframe width="100%" height="400" style="border: 1px solid #ccc;" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3024.1234567890!2d-74.00601234567890!3d40.71278901234567!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDQyJzQ2LjIiTiA3NMKwMDAnMjEuNiJX!5e0!3m2!1sen!2sus!4v1234567890" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>', category: 'Basic' },
                            { id: 'link-block', label: '<div class="gjs-block__media">' + getSvgIcon('link') + '</div><div class="gjs-block-label">Link Block</div>', content: '<a href="#" style="display: block; padding: 20px; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #333;">Link block with full area clickable</a>', category: 'Basic' },
                            { id: 'quote', label: '<div class="gjs-block__media">' + getSvgIcon('quote') + '</div><div class="gjs-block-label">Quote</div>', content: '<blockquote style="border-left: 4px solid #f1ba20; padding-left: 20px; margin: 20px 0; font-style: italic; color: #666;"><p>"Your inspiring quote goes here"</p><p style="font-size: 14px;">— Attribution</p></blockquote>', category: 'Basic' },
                            { id: 'text-section', label: '<div class="gjs-block__media">' + getSvgIcon('text') + '</div><div class="gjs-block-label">Text Section</div>', content: '<section style="padding: 40px; background: #f9f9f9;"><h2 style="margin-bottom: 20px;">Section Title</h2><p style="line-height: 1.6; color: #333;">Section content with multiple lines of text can go here.</p></section>', category: 'Basic' },
                            { id: 'form', label: '<div class="gjs-block__media">' + getSvgIcon('form') + '</div><div class="gjs-block-label">Form</div>', content: '<form style="max-width: 500px;"><div style="margin-bottom: 15px;"><input type="text" placeholder="Name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" /></div><div style="margin-bottom: 15px;"><input type="email" placeholder="Email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" /></div><button type="submit" style="padding: 10px 20px; background: #f1ba20; color: #000; border: none; border-radius: 4px; cursor: pointer;">Submit</button></form>', category: 'Forms' },
                            { id: 'input', label: '<div class="gjs-block__media">' + getSvgIcon('input') + '</div><div class="gjs-block-label">Input</div>', content: '<input type="text" placeholder="Input field" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" />', category: 'Forms' },
                            { id: 'textarea', label: '<div class="gjs-block__media">' + getSvgIcon('textarea') + '</div><div class="gjs-block-label">Textarea</div>', content: '<textarea placeholder="Message" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; min-height: 120px;"></textarea>', category: 'Forms' },
                            { id: 'select', label: '<div class="gjs-block__media">' + getSvgIcon('select') + '</div><div class="gjs-block-label">Select</div>', content: '<select style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"><option>Choose an option</option><option>Option 1</option><option>Option 2</option></select>', category: 'Forms' },
                            { id: 'button', label: '<div class="gjs-block__media">' + getSvgIcon('button') + '</div><div class="gjs-block-label">Button</div>', content: '<button style="padding: 12px 30px; background: #f1ba20; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Click me</button>', category: 'Forms' },
                            { id: 'label', label: '<div class="gjs-block__media">' + getSvgIcon('text') + '</div><div class="gjs-block-label">Label</div>', content: '<label style="display: block; margin-bottom: 10px; font-weight: bold;">Label text</label>', category: 'Forms' },
                            { id: 'checkbox', label: '<div class="gjs-block__media">' + getSvgIcon('checkbox') + '</div><div class="gjs-block-label">Checkbox</div>', content: '<div style="margin: 10px 0;"><input type="checkbox" id="cb1" /><label for="cb1" style="margin-left: 8px; display: inline;">Checkbox option</label></div>', category: 'Forms' },
                            { id: 'radio', label: '<div class="gjs-block__media">' + getSvgIcon('radio') + '</div><div class="gjs-block-label">Radio</div>', content: '<div style="margin: 10px 0;"><input type="radio" id="r1" name="radio-group" /><label for="r1" style="margin-left: 8px; display: inline;">Radio option</label></div>', category: 'Forms' },
                            { id: 'countdown', label: '<div class="gjs-block__media">' + getSvgIcon('box') + '</div><div class="gjs-block-label">Countdown</div>', content: '<div style="display: inline-block; padding: 20px; background: #f1ba20; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold;">00:00:00</div>', category: 'Extra' },
                            { id: 'tabs', label: '<div class="gjs-block__media">' + getSvgIcon('box') + '</div><div class="gjs-block-label">Tabs</div>', content: '<div><div style="display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px;"><button style="padding: 10px 20px; background: none; border: none; font-weight: bold; cursor: pointer; border-bottom: 3px solid #f1ba20;">Tab 1</button><button style="padding: 10px 20px; background: none; border: none; cursor: pointer;">Tab 2</button></div><div>Tab 1 content</div></div>', category: 'Extra' },
                            { id: 'custom-code', label: '<div class="gjs-block__media">' + getSvgIcon('code') + '</div><div class="gjs-block-label">Custom Code</div>', content: '<div style="background: #f5f5f5; padding: 20px; border-radius: 4px; font-family: monospace;"><code>&lt;div&gt;Custom HTML code&lt;/div&gt;</code></div>', category: 'Extra' },
                            { id: 'tooltip', label: '<div class="gjs-block__media">' + getSvgIcon('box') + '</div><div class="gjs-block-label">Tooltip</div>', content: '<span style="position: relative; cursor: help; text-decoration: underline; border-bottom: 1px dotted #666;">Hover me<span style="position: absolute; background: #333; color: white; padding: 8px 12px; border-radius: 4px; white-space: nowrap; bottom: 125%; left: 50%; transform: translateX(-50%); display: none; font-size: 12px;">Tooltip text</span></span>', category: 'Extra' }
                        ]
                    },
                    styleManager: { appendTo: '#styles-panel' },
                    layerManager: { appendTo: '#layers-panel' },
                    traitManager: { appendTo: '#styles-panel' },
                    deviceManager: {
                        devices: [
                            { name: 'Desktop', width: '' },
                            { name: 'Tablet', width: '768px', widthMedia: '768px' },
                            { name: 'Mobile', width: '375px', widthMedia: '375px' }
                        ]
                    }
                });

                if (postContent && postContent.trim()) {
                    try {
                        editor.setComponents(postContent);
                        console.log('Loaded content');

                        setTimeout(() => {
                            const styleMatch = postContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
                            if (styleMatch) {
                                const css = styleMatch[1];
                                const frame = document.querySelector('iframe[data-gjs]') || document.querySelector('iframe.gjs-frame');
                                if (frame && frame.contentDocument) {
                                    const oldStyle = frame.contentDocument.querySelector('style[data-custom-styles]');
                                    if (oldStyle) oldStyle.remove();
                                    const styleEl = frame.contentDocument.createElement('style');
                                    styleEl.setAttribute('data-custom-styles', 'true');
                                    styleEl.textContent = css;
                                    frame.contentDocument.head.appendChild(styleEl);
                                }
                            }
                        }, 200);
                    } catch (e) {
                        console.log('Could not parse existing content:', e);
                    }
                }

                console.log('Editor initialized');
            } catch (e) {
                console.error('Error initializing editor:', e);
            }
        }

        function saveContent(status) {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            if (!editor) {
                alert('Editor not initialized');
                return;
            }

            const components = editor.getComponents();
            let css = editor.getCss();
            let html = '';

            components.forEach(comp => {
                html += comp.toHTML();
            });

            if (css) {
                html += '<style>' + css + '</style>';
            }

            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt or '' }}',
                content: html,
                hero_image: '{{ post.hero_image or '' }}',
                template: '{{ post.template or 1 }}',
                status: status
            });

            const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 60000);

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'X-CSRF-Token': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString(),
                signal: controller.signal
            })
            .then(res => {
                clearTimeout(timeoutId);
                if (!res.ok) {
                    return res.text().then(text => {
                        throw new Error(`Save failed (${res.status}): ${text.substring(0, 200)}`);
                    });
                }
                return res.text();
            })
            .then(() => {
                window.location.href = '/admin#blog';
            })
            .catch(err => {
                clearTimeout(timeoutId);
                console.error('Fetch error:', err);
                if (err.name === 'AbortError') {
                    alert('Save took too long and timed out. Content may be too large.');
                } else {
                    alert('Error: ' + err.message);
                }
            });
        }

        function saveDraft() { saveContent('draft'); }
        function publishPost() { saveContent('published'); }
        function goBack() { window.location.href = '/admin#blog'; }
        function undo() { if (editor) editor.UndoManager.undo(); }
        function redo() { if (editor) editor.UndoManager.redo(); }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEditor);
        } else {
            initEditor();
        }
    </script>
</body>
</html>
