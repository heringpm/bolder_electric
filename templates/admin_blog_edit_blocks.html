<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Bolder Electric</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='js/grapes.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        .top-bar {
            background: #111;
            border-bottom: 1px solid rgba(241,186,32,0.22);
            padding: 12px 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            height: 60px;
            z-index: 1000;
        }

        .title-input {
            font-size: 16px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: #f5f3ef;
            flex: 1;
            padding: 8px;
        }

        .title-input:focus { outline: none; color: #f1ba20; }

        .btn {
            padding: 8px 14px;
            border: 1px solid rgba(241,186,32,0.22);
            background: rgba(241,186,32,0.12);
            color: #f1ba20;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        .editor-wrapper {
            display: flex;
            height: calc(100vh - 60px);
        }

        #editor {
            flex: 1;
            height: 100%;
        }

        /* GrapesJS Style Overrides */
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="btn" onclick="goBack()">← Back to Admin</button>
        <div style="margin-left: 20px; display: flex; gap: 8px; border-left: 1px solid rgba(241,186,32,0.22); padding-left: 20px;">
            <button class="btn" onclick="undo()" title="Undo (Ctrl+Z)"><i class="fas fa-undo"></i></button>
            <button class="btn" onclick="redo()" title="Redo (Ctrl+Y)"><i class="fas fa-redo"></i></button>
        </div>
        <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title or '' }}">
        <button class="btn" onclick="saveDraft()">Save as Draft</button>
        <button class="btn primary" onclick="publishPost()">Save & Publish</button>
    </div>

    <div class="editor-wrapper">
        <div id="editor"></div>
    </div>

    <script src="{{ url_for('static', filename='js/grapes.min.js') }}"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let editor = null;
        const maxWaitTime = 5000;
        const startTime = Date.now();

        function initEditor() {
            if (typeof grapesjs === 'undefined') {
                if (Date.now() - startTime < maxWaitTime) {
                    setTimeout(initEditor, 100);
                    return;
                }
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: Failed to load editor library.</p>';
                return;
            }

            try {
                editor = grapesjs.init({
                    container: '#editor',
                    fromElement: false,
                    height: '100%',
                    width: '100%',
                    storageManager: false,
                    undoManager: { trackChanges: true },
                    blockManager: { appendTo: '.gjs-blocks' },
                    styleManager: { appendTo: '.gjs-sm-properties' },
                    layerManager: { appendTo: '.gjs-layers' },
                    traitManager: { appendTo: '.gjs-tm-properties' },
                    deviceManager: {
                        devices: [
                            {
                                name: 'Desktop',
                                width: ''
                            },
                            {
                                name: 'Tablet',
                                width: '768px',
                                widthMedia: '768px'
                            },
                            {
                                name: 'Mobile',
                                width: '375px',
                                widthMedia: '375px'
                            }
                        ]
                    },
                });

                // Load existing content
                if (postContent && postContent.trim()) {
                    try {
                        // Load content with CSS intact
                        editor.setComponents(postContent);
                        console.log('Loaded content with CSS');

                        // Also try to inject CSS into the frame if it exists
                        setTimeout(() => {
                            const styleMatch = postContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
                            if (styleMatch) {
                                const css = styleMatch[1];

                                // Get the editor's iframe and inject the CSS
                                const frame = document.querySelector('iframe[data-gjs]') || document.querySelector('iframe.gjs-frame');
                                if (frame && frame.contentDocument) {
                                    // Remove old style tag to avoid duplicates
                                    const oldStyle = frame.contentDocument.querySelector('style[data-custom-styles]');
                                    if (oldStyle) oldStyle.remove();

                                    // Add new style tag with saved CSS
                                    const styleEl = frame.contentDocument.createElement('style');
                                    styleEl.setAttribute('data-custom-styles', 'true');
                                    styleEl.textContent = css;
                                    frame.contentDocument.head.appendChild(styleEl);

                                    // Also apply body background directly to ensure it sticks
                                    const bodyBgMatch = css.match(/body\s*{[^}]*background-color:\s*([^;!}]+)/i);
                                    if (bodyBgMatch && bodyBgMatch[1]) {
                                        const bgColor = bodyBgMatch[1].trim();
                                        frame.contentDocument.body.style.backgroundColor = bgColor;
                                        frame.contentDocument.body.style.backgroundImage = 'none';
                                    }

                                    console.log('Injected CSS into frame, CSS length:', css.length);
                                }
                            }
                        }, 200);
                    } catch (e) {
                        console.log('Could not parse existing content:', e);
                    }
                }

                console.log('Editor initialized successfully');
            } catch (e) {
                console.error('Error initializing editor:', e);
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px;">Error: ' + e.message + '</p>';
            }
        }

        function saveContent(status) {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            if (!editor) {
                alert('Editor not initialized');
                return;
            }

            // Get components and styles
            const components = editor.getComponents();
            let css = editor.getCss();


            // Move wrapper background color to body rule
            // GrapesJS renders wrapper as div with unique ID. Get the color directly from the wrapper element,
            // not from the CSS (which may contain old colors from previously loaded content)
            const wrapper = editor.getSelected();
            let wrapperBgColor = null;

            if (wrapper && (wrapper.getName() === 'Body' || wrapper.get('type') === 'wrapper')) {
                const wrapperStyle = wrapper.getStyle();
                if (wrapperStyle && wrapperStyle['background-color']) {
                    wrapperBgColor = wrapperStyle['background-color'];
                }
            }

            // Fallback: if wrapper isn't selected, try to extract from CSS
            if (!wrapperBgColor) {
                const matches = css.match(/background-color:\s*([^;}]+)/g);
                if (matches && matches.length > 0) {
                    const lastMatch = matches[matches.length - 1];
                    wrapperBgColor = lastMatch.split(':')[1].trim();
                }
            }

            if (wrapperBgColor) {
                // Replace ALL body rules to ensure the color is applied
                css = css.replace(/body\s*\{[^}]*\}/g, (match) => {
                    if (/background-color/i.test(match)) {
                        return match.replace(/background-color:\s*[^;!]+[!;]?/i, `background-color: ${wrapperBgColor}`);
                    } else {
                        return match.replace(/}/, `background-color: ${wrapperBgColor}; }`);
                    }
                });
            }

            let html = '';

            // Render components to HTML
            components.forEach(comp => {
                html += comp.toHTML();
            });

            // Add styles
            if (css) {
                html += '<style>' + css + '</style>';
            }


            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt or '' }}',
                content: html,
                hero_image: '{{ post.hero_image or '' }}',
                template: '{{ post.template or 1 }}',
                status: status
            });

            const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;


            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 second timeout

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'X-CSRF-Token': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString(),
                signal: controller.signal
            })
            .then(res => {
                clearTimeout(timeoutId);
                if (!res.ok) {
                    return res.text().then(text => {
                        throw new Error(`Save failed (${res.status}): ${text.substring(0, 200)}`);
                    });
                }
                return res.text();
            })
            .then(() => {
                window.location.href = '/admin#blog';
            })
            .catch(err => {
                clearTimeout(timeoutId);
                console.error('Fetch error:', err);
                if (err.name === 'AbortError') {
                    alert('Save took too long and timed out. Content may be too large.');
                } else {
                    alert('Error: ' + err.message);
                }
            });
        }

        function saveDraft() {
            saveContent('draft');
        }

        function publishPost() {
            saveContent('published');
        }

        function savePost() {
            publishPost();
        }

        function goBack() {
            window.location.href = '/admin#blog';
        }

        function undo() {
            if (editor) {
                editor.UndoManager.undo();
            }
        }

        function redo() {
            if (editor) {
                editor.UndoManager.redo();
            }
        }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEditor);
        } else {
            initEditor();
        }
    </script>
</body>
</html>
