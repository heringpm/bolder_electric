<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Editor | Bolder Electric Admin</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <style>
        :root {
            --bg: #0a0a0a; --panel: #111; --panel2: #161616;
            --line: rgba(241,186,32,0.22); --gold: #f1ba20;
            --text: #f5f3ef; --muted: rgba(245,243,239,0.6);
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: "Barlow Condensed", Arial, sans-serif; }
        a { color: inherit; text-decoration: none; }

        .container {
            display: flex; height: 100vh; flex-direction: column;
        }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; height: 64px;
            background: var(--panel); border-bottom: 1px solid var(--line);
            z-index: 100;
        }
        .header-title {
            font-family: "Bebas Neue", Arial, sans-serif;
            font-size: 20px; letter-spacing: 0.06em; color: var(--gold);
        }

        .editor-wrapper {
            display: flex; flex: 1; overflow: hidden;
        }

        /* Left sidebar - blocks list */
        .blocks-panel {
            width: 280px; background: var(--panel2); border-right: 1px solid var(--line);
            padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
        }
        .blocks-panel-title {
            font-size: 13px; font-weight: bold; color: var(--gold); text-transform: uppercase;
            margin-bottom: 8px;
        }
        .block-item {
            padding: 12px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 6px; cursor: grab; user-select: none;
            font-size: 14px; display: flex; justify-content: space-between; align-items: center;
        }
        .block-item:hover { border-color: rgba(241,186,32,0.5); background: var(--panel); }
        .block-item.text { color: #87ceeb; }
        .block-item.image { color: #90ee90; }
        .block-badge {
            font-size: 11px; padding: 2px 8px; background: rgba(241,186,32,0.15);
            color: var(--gold); border-radius: 4px;
        }

        /* Main canvas */
        .canvas-area {
            flex: 1; display: flex; flex-direction: column;
        }

        .canvas-toolbar {
            padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
            display: flex; gap: 12px; align-items: center; font-size: 13px;
        }
        .canvas-toolbar button {
            padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent;
            color: var(--muted); cursor: pointer; font-family: inherit;
        }
        .canvas-toolbar button:hover { color: var(--text); border-color: rgba(241,186,32,0.5); }

        .canvas {
            flex: 1; overflow: auto; padding: 40px; background: rgba(0,0,0,0.3);
        }

        .canvas-content {
            max-width: 800px; margin: 0 auto; background: var(--panel); border-radius: 10px;
            padding: 40px; min-height: 600px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .layout-row {
            display: grid; gap: 20px; margin-bottom: 24px; min-height: 100px;
            border: 2px dashed rgba(241,186,32,0.2); border-radius: 8px; padding: 16px;
            position: relative;
        }
        .layout-row.cols-2 { grid-template-columns: 1fr 1fr; }
        .layout-row.cols-1 { grid-template-columns: 1fr; }
        .layout-row.no-content { display: flex; align-items: center; justify-content: center;
            color: var(--muted); font-size: 14px; min-height: 80px;
        }

        .block-slot {
            position: relative; background: rgba(241,186,32,0.05); border: 1px solid var(--line);
            border-radius: 6px; padding: 12px; min-height: 60px; display: flex; flex-direction: column;
            justify-content: space-between; cursor: grab;
        }
        .block-slot:hover { background: rgba(241,186,32,0.08); border-color: rgba(241,186,32,0.4); }
        .block-slot.selected { background: rgba(241,186,32,0.12); border-color: var(--gold); }

        .block-content {
            flex: 1; overflow: hidden; word-wrap: break-word; line-height: 1.4;
        }
        .block-content img {
            max-width: 100%; height: auto; border-radius: 6px; display: block;
        }
        .block-content p {
            margin: 0; font-size: 16px; line-height: 1.5;
        }

        .block-toolbar {
            display: flex; gap: 8px; margin-top: 8px; justify-content: space-between; font-size: 11px;
        }
        .block-btn {
            padding: 3px 8px; background: rgba(241,186,32,0.1); color: var(--gold);
            border: 1px solid rgba(241,186,32,0.3); border-radius: 4px; cursor: pointer;
            font-family: inherit; font-size: 11px;
        }
        .block-btn:hover { background: rgba(241,186,32,0.15); }
        .block-btn.delete { color: #e05252; border-color: rgba(224,82,82,0.3); background: rgba(224,82,82,0.05); }
        .block-btn.delete:hover { background: rgba(224,82,82,0.1); }

        .controls-panel {
            width: 260px; background: var(--panel2); border-left: 1px solid var(--line);
            padding: 16px; overflow-y: auto; font-size: 13px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-label {
            font-size: 11px; color: var(--gold); text-transform: uppercase; font-weight: bold;
            margin-bottom: 8px; display: block;
        }
        .control-input {
            width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--line); border-radius: 6px; color: var(--text);
            font-family: inherit; font-size: 13px;
        }
        .control-input:focus { outline: none; border-color: var(--gold); }

        .bottom-bar {
            padding: 16px 28px; background: var(--panel); border-top: 1px solid var(--line);
            display: flex; gap: 12px; justify-content: center;
        }
        .btn {
            padding: 12px 28px; border-radius: 8px; border: 1px solid var(--line);
            background: rgba(241,186,32,0.12); color: var(--gold); font-family: "Bebas Neue", Arial, sans-serif;
            font-size: 16px; letter-spacing: 0.06em; cursor: pointer;
        }
        .btn:hover { border-color: rgba(241,186,32,0.5); background: rgba(241,186,32,0.18); }
        .btn.back { background: var(--panel2); color: var(--text); border-color: var(--line); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="header-title">Layout Editor</span>
            <span style="font-size: 14px; color: var(--muted);">{{ post.title }}</span>
        </div>

        <div class="editor-wrapper">
            <!-- Left: Blocks List -->
            <div class="blocks-panel">
                <div class="blocks-panel-title">Elements</div>
                <div id="blocksList"></div>
                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line);">
                    <button class="btn" style="width: 100%; padding: 8px;" onclick="addRow('cols-1')">+ Full Width Row</button>
                    <button class="btn" style="width: 100%; padding: 8px; margin-top: 8px;" onclick="addRow('cols-2')">+ 2-Column Row</button>
                </div>
            </div>

            <!-- Center: Canvas -->
            <div class="canvas-area">
                <div class="canvas-toolbar">
                    <span style="color: var(--muted);">Drag blocks from left, position in layout. Click to select and edit.</span>
                </div>
                <div class="canvas">
                    <div class="canvas-content" id="canvas"></div>
                </div>
            </div>

            <!-- Right: Controls -->
            <div class="controls-panel">
                <div class="control-group">
                    <span class="control-label">Selected Block</span>
                    <div id="selectedBlockInfo" style="color: var(--muted); font-size: 12px;">Click a block to edit</div>
                </div>
                <div id="editorControls"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn back" onclick="goBack()">← Cancel</button>
            <button class="btn" onclick="saveLayout()">Save & Continue →</button>
        </div>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let selectedBlockId = null;
        let blockIdCounter = 0;

        function parseHTML(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            const blocks = [];

            div.childNodes.forEach(node => {
                if (node.nodeType === 3 && node.textContent.trim()) return;
                if (node.tagName === 'P' || node.tagName === 'IMG') {
                    const id = blockIdCounter++;
                    if (node.tagName === 'P') {
                        blocks.push({
                            id, type: 'text', content: node.innerHTML,
                            fontSize: node.style.fontSize || '16px',
                            marginBottom: node.style.marginBottom || '16px'
                        });
                    } else if (node.tagName === 'IMG') {
                        blocks.push({
                            id, type: 'image', src: node.src, alt: node.alt || 'Image',
                            maxWidth: node.style.maxWidth || '100%',
                            marginBottom: node.style.marginBottom || '16px'
                        });
                    }
                }
            });
            return blocks;
        }

        let layout = [{ type: 'row', cols: 'cols-1', blocks: [] }];
        let blocks = parseHTML(postContent);

        function renderBlocksList() {
            const list = document.getElementById('blocksList');
            list.innerHTML = '';
            blocks.forEach(block => {
                const item = document.createElement('div');
                item.className = `block-item ${block.type}`;
                item.draggable = true;
                item.innerHTML = `
                    <span>${block.type === 'text' ? '📝' : '🖼'} ${block.type === 'text' ? 'Text' : 'Image'}</span>
                    <span class="block-badge">#${block.id}</span>
                `;
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'copy';
                    e.dataTransfer.setData('blockId', block.id);
                });
                list.appendChild(item);
            });
        }

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';

            if (layout.length === 0) {
                canvas.innerHTML = '<div style="text-align: center; color: var(--muted);">Add rows to start building</div>';
                return;
            }

            layout.forEach((row, rowIdx) => {
                const rowEl = document.createElement('div');
                rowEl.className = `layout-row ${row.cols}`;
                rowEl.dataset.rowIndex = rowIdx;

                if (row.blocks.length === 0) {
                    rowEl.classList.add('no-content');
                    rowEl.innerHTML = `<div>Drag blocks here</div>`;
                } else {
                    row.cols === 'cols-2'
                        ? renderTwoColRow(rowEl, row, rowIdx)
                        : renderOneColRow(rowEl, row, rowIdx);
                }

                rowEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'copy';
                    rowEl.style.borderColor = 'rgba(241,186,32,0.6)';
                });
                rowEl.addEventListener('dragleave', () => {
                    rowEl.style.borderColor = 'rgba(241,186,32,0.2)';
                });
                rowEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    rowEl.style.borderColor = 'rgba(241,186,32,0.2)';
                    const blockId = parseInt(e.dataTransfer.getData('blockId'));
                    addBlockToRow(rowIdx, blockId);
                });

                canvas.appendChild(rowEl);
            });
        }

        function renderOneColRow(rowEl, row, rowIdx) {
            row.blocks.forEach((blockId, colIdx) => {
                const block = blocks.find(b => b.id === blockId);
                if (!block) return;
                const slot = renderBlockSlot(block, rowIdx, colIdx);
                rowEl.appendChild(slot);
            });
            addRowControls(rowEl, rowIdx);
        }

        function renderTwoColRow(rowEl, row, rowIdx) {
            const col1 = document.createElement('div');
            const col2 = document.createElement('div');
            if (row.blocks.length > 0) col1.appendChild(renderBlockSlot(blocks.find(b => b.id === row.blocks[0]), rowIdx, 0));
            if (row.blocks.length > 1) col2.appendChild(renderBlockSlot(blocks.find(b => b.id === row.blocks[1]), rowIdx, 1));
            rowEl.appendChild(col1);
            rowEl.appendChild(col2);
            addRowControls(rowEl, rowIdx);
        }

        function renderBlockSlot(block, rowIdx, colIdx) {
            const slot = document.createElement('div');
            slot.className = 'block-slot';
            slot.dataset.blockId = block.id;
            if (selectedBlockId === block.id) slot.classList.add('selected');

            const content = document.createElement('div');
            content.className = 'block-content';

            if (block.type === 'text') {
                content.innerHTML = block.content;
                content.style.fontSize = block.fontSize;
            } else {
                const img = document.createElement('img');
                img.src = block.src;
                img.alt = block.alt;
                img.style.maxWidth = block.maxWidth;
                content.appendChild(img);
            }

            const toolbar = document.createElement('div');
            toolbar.className = 'block-toolbar';
            toolbar.innerHTML = `
                <span>${block.type === 'text' ? 'Text' : 'Image'} #${block.id}</span>
                <div>
                    <button class="block-btn" onclick="selectBlock(${block.id}, ${rowIdx}, ${colIdx})">Edit</button>
                    <button class="block-btn delete" onclick="removeBlock(${rowIdx}, ${colIdx})">Remove</button>
                </div>
            `;

            slot.appendChild(content);
            slot.appendChild(toolbar);
            return slot;
        }

        function addRowControls(rowEl, rowIdx) {
            const control = document.createElement('button');
            control.className = 'block-btn'
            control.style.position = 'absolute';
            control.style.top = '-28px';
            control.style.right = '0';
            control.innerHTML = '×';
            control.onclick = () => removeRow(rowIdx);
            rowEl.style.position = 'relative';
            rowEl.appendChild(control);
        }

        function selectBlock(blockId, rowIdx, colIdx) {
            selectedBlockId = blockId;
            const block = blocks.find(b => b.id === blockId);
            document.getElementById('selectedBlockInfo').textContent = `${block.type === 'text' ? 'Text' : 'Image'} Block #${blockId}`;

            const controls = document.getElementById('editorControls');
            controls.innerHTML = '';

            if (block.type === 'text') {
                controls.innerHTML = `
                    <div class="control-group">
                        <label class="control-label">Content</label>
                        <textarea class="control-input" style="height: 100px;" id="textContent">${block.content}</textarea>
                        <button class="btn" style="width: 100%; margin-top: 8px;" onclick="updateTextBlock()">Update</button>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Font Size</label>
                        <input type="text" class="control-input" id="fontSize" value="${block.fontSize}">
                    </div>
                `;
            } else {
                controls.innerHTML = `
                    <div class="control-group">
                        <label class="control-label">Max Width</label>
                        <input type="text" class="control-input" id="maxWidth" value="${block.maxWidth}">
                    </div>
                    <button class="btn" style="width: 100%;" onclick="updateImageBlock()">Update</button>
                `;
            }
            renderCanvas();
        }

        function updateTextBlock() {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.content = document.getElementById('textContent').value;
            block.fontSize = document.getElementById('fontSize').value;
            renderCanvas();
        }

        function updateImageBlock() {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.maxWidth = document.getElementById('maxWidth').value;
            renderCanvas();
        }

        function addBlockToRow(rowIdx, blockId) {
            if (!layout[rowIdx]) return;
            if (layout[rowIdx].blocks.includes(blockId)) return;
            if (layout[rowIdx].cols === 'cols-2' && layout[rowIdx].blocks.length >= 2) return;
            layout[rowIdx].blocks.push(blockId);
            renderCanvas();
        }

        function removeBlock(rowIdx, colIdx) {
            if (layout[rowIdx]?.blocks[colIdx]) {
                layout[rowIdx].blocks.splice(colIdx, 1);
            }
            selectedBlockId = null;
            document.getElementById('editorControls').innerHTML = '';
            renderCanvas();
        }

        function addRow(cols) {
            layout.push({ type: 'row', cols, blocks: [] });
            renderCanvas();
        }

        function removeRow(rowIdx) {
            layout.splice(rowIdx, 1);
            renderCanvas();
        }

        function saveLayout() {
            const html = [];
            layout.forEach(row => {
                row.blocks.forEach(blockId => {
                    const block = blocks.find(b => b.id === blockId);
                    if (!block) return;
                    if (block.type === 'text') {
                        html.push(`<p style="font-size:${block.fontSize};margin-bottom:${block.marginBottom};">${block.content}</p>`);
                    } else {
                        html.push(`<img src="${block.src}" alt="${block.alt}" style="max-width:${block.maxWidth};height:auto;margin:0 0 ${block.marginBottom} 0;border-radius:8px;">`);
                    }
                });
            });

            const formData = new URLSearchParams({
                title: '{{ post.title }}',
                slug: '{{ post.slug }}',
                excerpt: '{{ post.excerpt }}',
                content: html.join('\n'),
                hero_image: '{{ post.hero_image }}',
                template: '{{ post.template }}',
                status: '{{ post.status }}'
            });

            fetch(`/admin/blog/${postId}/edit`, {
                method: 'POST',
                headers: { 'X-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(() => {
                window.location.href = `/admin/blog/${postId}/edit`;
            }).catch(err => console.error('Error:', err));
        }

        function goBack() {
            if (confirm('Discard all changes?')) {
                fetch(`/admin/blog/${postId}/delete`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } })
                    .then(() => window.location.href = '/admin#blog');
            }
        }

        renderBlocksList();
        renderCanvas();
    </script>
</body>
</html>
