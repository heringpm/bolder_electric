<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor | Bolder Electric Admin</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #111;
            --gold: #f1ba20;
            --text: #f5f3ef;
            --muted: rgba(245,243,239,0.6);
            --line: rgba(241,186,32,0.22);
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }

        .container { display: flex; height: 100vh; flex-direction: column; }

        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .title-input {
            font-size: 20px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: var(--text);
            flex: 1;
            padding: 8px 0;
        }

        .title-input:focus { outline: none; color: var(--gold); }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--line);
            background: rgba(241,186,32,0.12);
            color: var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        .editor-area { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 220px;
            background: rgba(0,0,0,0.3);
            border-right: 1px solid var(--line);
            padding: 20px 16px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 12px;
            font-weight: bold;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(241,186,32,0.15);
            border: 1px solid rgba(241,186,32,0.3);
            color: var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .add-btn:hover { background: rgba(241,186,32,0.25); border-color: rgba(241,186,32,0.5); }

        .canvas {
            flex: 1;
            background: linear-gradient(135deg, rgba(241,186,32,0.02) 0%, transparent 100%);
            overflow-y: auto;
            padding: 40px;
        }

        .blocks-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .block {
            background: var(--panel);
            border: 2px solid transparent;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
            cursor: move;
            transition: all 0.2s;
            position: relative;
            user-select: none;
        }

        .block:hover { border-color: var(--gold); background: rgba(241,186,32,0.08); }
        .block.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(241,186,32,0.3); }

        .block-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .block:hover .block-controls { opacity: 1; }

        .control-btn {
            padding: 4px 8px;
            background: rgba(241,186,32,0.2);
            border: 1px solid rgba(241,186,32,0.3);
            color: var(--gold);
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        .control-btn:hover { background: rgba(241,186,32,0.3); }
        .control-btn.delete { color: #e05252; border-color: rgba(224,82,82,0.3); background: rgba(224,82,82,0.05); }
        .control-btn.delete:hover { background: rgba(224,82,82,0.15); }

        .text-block { min-height: 60px; }
        .text-block p { margin: 0; line-height: 1.6; }
        .text-block[contenteditable] { outline: none; }
        .text-block[contenteditable]:focus { background: rgba(241,186,32,0.1); padding: 4px; border-radius: 4px; }

        .image-block img { width: 100%; max-height: 500px; object-fit: cover; border-radius: 4px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state p { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title or '' }}">
            <button class="btn" onclick="goBack()">← Discard</button>
            <button class="btn primary" onclick="savePost()">Save & Publish</button>
        </div>

        <div class="editor-area">
            <div class="sidebar">
                <div class="sidebar-title">Add Blocks</div>
                <button class="add-btn" onclick="addTextBlock()">+ Text</button>
                <button class="add-btn" onclick="addImageBlock()">+ Image</button>
            </div>

            <div class="canvas">
                <div class="blocks-container" id="blocksContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let blocks = [];
        let blockIdCounter = 0;
        let selectedBlockId = null;

        class Block {
            constructor(id, type, content = '') {
                this.id = id;
                this.type = type;
                this.content = content;
            }
        }

        function parseContent() {
            if (!postContent || !postContent.trim()) return;

            const div = document.createElement('div');
            div.innerHTML = postContent;

            div.querySelectorAll('*').forEach(el => {
                if (el.tagName === 'P') {
                    blocks.push(new Block(blockIdCounter++, 'text', el.innerHTML));
                } else if (el.tagName === 'IMG') {
                    blocks.push(new Block(blockIdCounter++, 'image', el.src));
                }
            });
        }

        function render() {
            const container = document.getElementById('blocksContainer');

            if (blocks.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Click + Text or + Image to get started</p></div>';
                return;
            }

            container.innerHTML = blocks.map(block => {
                const isSelected = block.id === selectedBlockId;
                return `
                    <div class="block ${isSelected ? 'selected' : ''}" data-id="${block.id}" onclick="selectBlock(${block.id})">
                        <div class="block-controls">
                            <button class="control-btn delete" onclick="deleteBlock(${block.id}); return false;">Delete</button>
                        </div>
                        ${block.type === 'text' ? `
                            <p class="text-block" contenteditable="true" onblur="updateBlockContent(${block.id}, this.innerHTML)" onkeydown="handleEnter(event, ${block.id})">${block.content}</p>
                        ` : `
                            <div class="image-block">
                                <img src="${block.content}" alt="Block image" style="width: 100%; border-radius: 4px;">
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        function selectBlock(id) {
            selectedBlockId = id;
            render();
        }

        function addTextBlock() {
            blocks.push(new Block(blockIdCounter++, 'text', '<p>Add your text here</p>'));
            render();
            setTimeout(() => {
                const p = document.querySelector('[data-id="' + (blockIdCounter - 1) + '"] p');
                if (p) p.focus();
            }, 0);
        }

        function addImageBlock() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                fetch('/admin/blog/upload-image', {
                    method: 'POST',
                    headers: { 'X-CSRF-Token': csrfToken },
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    blocks.push(new Block(blockIdCounter++, 'image', data.url));
                    render();
                })
                .catch(err => alert('Error uploading image'));
            };
            input.click();
        }

        function deleteBlock(id) {
            blocks = blocks.filter(b => b.id !== id);
            selectedBlockId = null;
            render();
        }

        function updateBlockContent(id, content) {
            const block = blocks.find(b => b.id === id);
            if (block) block.content = content;
        }

        function handleEnter(e, id) {
            // Let default enter behavior work
        }

        function goBack() {
            if (confirm('Discard all changes?')) {
                window.location.href = '/admin#blog';
            }
        }

        function savePost() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Please enter a title');
                return;
            }

            const html = blocks.map(block => {
                if (block.type === 'text') {
                    return `<p>${block.content}</p>`;
                } else {
                    return `<img src="${block.content}" alt="Image" style="width: 100%; border-radius: 4px;">`;
                }
            }).join('\n');

            const formData = new URLSearchParams({
                title,
                slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                excerpt: '{{ post.excerpt or '' }}',
                content: html,
                hero_image: '{{ post.hero_image or '' }}',
                template: '{{ post.template or 1 }}',
                status: 'published'
            });

            const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;

            fetch(endpoint, {
                method: 'POST',
                headers: { 'X-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error('Save failed');
                window.location.href = '/admin#blog';
            })
            .catch(err => {
                alert('Error saving post: ' + err.message);
            });
        }

        // Initialize
        parseContent();
        render();
    </script>
</body>
</html>
