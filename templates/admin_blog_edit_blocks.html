<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Editor | Bolder Electric Admin</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --panel: #111; --panel2: #161616;
            --line: rgba(241,186,32,0.22); --gold: #f1ba20;
            --text: #f5f3ef; --muted: rgba(245,243,239,0.6);
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: "Barlow Condensed", Arial, sans-serif; }
        a { color: inherit; text-decoration: none; }

        .container {
            display: flex; height: 100vh; flex-direction: column;
        }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; height: 64px;
            background: var(--panel); border-bottom: 1px solid var(--line);
            z-index: 100;
        }
        .header-title {
            font-family: "Bebas Neue", Arial, sans-serif;
            font-size: 20px; letter-spacing: 0.06em; color: var(--gold);
        }

        .editor-wrapper {
            display: flex; flex: 1; overflow: hidden;
        }

        .canvas-area {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }

        .canvas-toolbar {
            padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
            font-size: 13px; color: var(--muted);
        }

        .canvas {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 40px 20px; background: rgba(0,0,0,0.3);
        }

        .canvas-content {
            max-width: 800px; margin: 0 auto; background: var(--panel); border-radius: 10px;
            padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .layout-block {
            margin-bottom: 28px; position: relative; cursor: grab;
            padding: 16px; border: 2px solid transparent; border-radius: 8px;
            transition: all 0.2s;
        }
        .layout-block:hover { border-color: rgba(241,186,32,0.3); background: rgba(241,186,32,0.03); }
        .layout-block.selected { border-color: var(--gold); background: rgba(241,186,32,0.08); }

        .block-content {
            line-height: 1.6;
        }
        .block-content p { margin: 0 0 16px 0; }
        .block-content p:last-child { margin-bottom: 0; }
        .block-content img {
            max-width: 100%; height: auto; border-radius: 8px; display: block;
            margin: 16px 0;
        }

        .block-overlay {
            position: absolute; top: 8px; right: 8px; display: none; gap: 6px;
        }
        .layout-block:hover .block-overlay { display: flex; }
        .block-btn {
            padding: 4px 8px; background: rgba(241,186,32,0.15); color: var(--gold);
            border: 1px solid rgba(241,186,32,0.3); border-radius: 4px; cursor: pointer;
            font-family: inherit; font-size: 11px;
        }
        .block-btn:hover { background: rgba(241,186,32,0.25); }
        .block-btn.delete { color: #e05252; border-color: rgba(224,82,82,0.3); background: rgba(224,82,82,0.05); }
        .block-btn.delete:hover { background: rgba(224,82,82,0.1); }

        .controls-panel {
            width: 300px; background: var(--panel2); border-left: 1px solid var(--line);
            padding: 20px; overflow-y: auto; font-size: 13px;
        }
        .control-group {
            margin-bottom: 24px;
        }
        .control-label {
            font-size: 11px; color: var(--gold); text-transform: uppercase; font-weight: bold;
            margin-bottom: 10px; display: block;
        }
        .control-input {
            width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--line); border-radius: 6px; color: var(--text);
            font-family: inherit; font-size: 13px;
        }
        .control-input:focus { outline: none; border-color: var(--gold); }

        .format-toolbar {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
        }
        .format-btn {
            padding: 8px; background: rgba(241,186,32,0.1); border: 1px solid rgba(241,186,32,0.3);
            border-radius: 6px; color: var(--gold); cursor: pointer; font-family: inherit;
            font-size: 12px; font-weight: bold;
        }
        .format-btn:hover { background: rgba(241,186,32,0.15); }
        .format-btn.active { background: rgba(241,186,32,0.25); }

        .align-buttons {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
        }
        .align-btn {
            padding: 6px; background: rgba(241,186,32,0.1); border: 1px solid rgba(241,186,32,0.3);
            border-radius: 4px; color: var(--muted); cursor: pointer; font-size: 11px;
        }
        .align-btn.active { background: rgba(241,186,32,0.25); color: var(--gold); }

        .quill-wrap { background: rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden; }
        .ql-toolbar { background: var(--panel2); border: 1px solid var(--line); border-bottom: 1px solid var(--line); }
        .ql-container { background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-top: none; }
        .ql-editor { color: var(--text); min-height: 100px; }

        .bottom-bar {
            padding: 16px 28px; background: var(--panel); border-top: 1px solid var(--line);
            display: flex; gap: 12px; justify-content: center;
        }
        .btn {
            padding: 12px 28px; border-radius: 8px; border: 1px solid var(--line);
            background: rgba(241,186,32,0.12); color: var(--gold); font-family: "Bebas Neue", Arial, sans-serif;
            font-size: 16px; letter-spacing: 0.06em; cursor: pointer;
        }
        .btn:hover { border-color: rgba(241,186,32,0.5); background: rgba(241,186,32,0.18); }
        .btn.back { background: var(--panel2); color: var(--text); border-color: var(--line); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="header-title">Layout Editor</span>
            <span style="font-size: 14px; color: var(--muted);">{{ post.title }}</span>
        </div>

        <div class="editor-wrapper">
            <!-- Canvas -->
            <div class="canvas-area">
                <div class="canvas-toolbar">
                    Click any element to edit. Drag to reorder.
                </div>
                <div class="canvas">
                    <div class="canvas-content" id="canvas"></div>
                </div>
            </div>

            <!-- Right: Controls -->
            <div class="controls-panel">
                <div class="control-group">
                    <span class="control-label">Selected Block</span>
                    <div id="selectedBlockInfo" style="color: var(--muted); font-size: 12px;">Click an element to edit</div>
                </div>
                <div id="editorControls"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn back" onclick="goBack()">← Cancel</button>
            <button class="btn" onclick="saveLayout()">Save & Continue →</button>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        let selectedBlockId = null;
        let blockIdCounter = 0;
        let activeEditor = null;

        function parseHTML(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            const blocks = [];

            div.childNodes.forEach(node => {
                if (node.nodeType === 3 && node.textContent.trim()) return;
                if (node.tagName === 'P' || node.tagName === 'IMG') {
                    const id = blockIdCounter++;
                    if (node.tagName === 'P') {
                        blocks.push({
                            id, type: 'text',
                            content: node.innerHTML,
                            fontSize: parseInt(node.style.fontSize) || 16,
                            align: node.style.textAlign || 'left',
                            bold: node.style.fontWeight === 'bold' ? true : false
                        });
                    } else if (node.tagName === 'IMG') {
                        blocks.push({
                            id, type: 'image',
                            src: node.src,
                            alt: node.alt || 'Image',
                            maxWidth: parseInt(node.style.maxWidth) || 100,
                            align: 'center'
                        });
                    }
                }
            });
            return blocks;
        }

        let blocks = parseHTML(postContent);

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';

            blocks.forEach((block, idx) => {
                const blockEl = document.createElement('div');
                blockEl.className = 'layout-block';
                blockEl.dataset.blockId = block.id;
                if (selectedBlockId === block.id) blockEl.classList.add('selected');

                const content = document.createElement('div');
                content.className = 'block-content';

                if (block.type === 'text') {
                    content.innerHTML = block.content;
                    content.style.fontSize = block.fontSize + 'px';
                    content.style.textAlign = block.align;
                    if (block.bold) content.style.fontWeight = 'bold';
                } else if (block.type === 'image') {
                    const img = document.createElement('img');
                    img.src = block.src;
                    img.alt = block.alt;
                    img.style.maxWidth = block.maxWidth + '%';
                    img.style.display = block.align === 'center' ? 'block' : 'inline';
                    if (block.align === 'center') img.style.margin = '0 auto';
                    content.appendChild(img);
                }

                const overlay = document.createElement('div');
                overlay.className = 'block-overlay';
                overlay.innerHTML = `
                    <button class="block-btn" onclick="selectBlock(${block.id})">Edit</button>
                    <button class="block-btn delete" onclick="deleteBlock(${block.id})">Remove</button>
                `;

                blockEl.appendChild(content);
                blockEl.appendChild(overlay);
                blockEl.addEventListener('click', () => selectBlock(block.id));
                blockEl.draggable = true;

                let draggedId = null;
                blockEl.addEventListener('dragstart', (e) => {
                    draggedId = block.id;
                    e.dataTransfer.effectAllowed = 'move';
                    blockEl.style.opacity = '0.5';
                });
                blockEl.addEventListener('dragend', () => blockEl.style.opacity = '1');
                blockEl.addEventListener('dragover', (e) => e.preventDefault());
                blockEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const draggedBlock = blocks.find(b => b.id === draggedId);
                    const currentBlock = blocks.find(b => b.id === block.id);
                    const dragIdx = blocks.indexOf(draggedBlock);
                    const currentIdx = blocks.indexOf(currentBlock);
                    if (dragIdx !== currentIdx) {
                        blocks.splice(dragIdx, 1);
                        blocks.splice(currentIdx, 0, draggedBlock);
                        renderCanvas();
                    }
                });

                canvas.appendChild(blockEl);
            });
        }

        function selectBlock(blockId) {
            selectedBlockId = blockId;
            const block = blocks.find(b => b.id === blockId);
            document.getElementById('selectedBlockInfo').textContent = `${block.type === 'text' ? 'Text' : 'Image'} Block`;

            const controls = document.getElementById('editorControls');
            controls.innerHTML = '';

            if (block.type === 'text') {
                controls.innerHTML = `
                    <div class="control-group">
                        <label class="control-label">Content</label>
                        <div class="quill-wrap"><div id="editor"></div></div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Formatting</label>
                        <div class="format-toolbar">
                            <button class="format-btn ${block.bold ? 'active' : ''}" onclick="toggleBold()"><strong>Bold</strong></button>
                            <button class="format-btn" onclick="openLinkDialog()">Link</button>
                        </div>
                        <label class="control-label" style="margin-top: 12px;">Alignment</label>
                        <div class="align-buttons">
                            <button class="align-btn ${block.align === 'left' ? 'active' : ''}" onclick="setAlign('left')">Left</button>
                            <button class="align-btn ${block.align === 'center' ? 'active' : ''}" onclick="setAlign('center')">Center</button>
                            <button class="align-btn ${block.align === 'right' ? 'active' : ''}" onclick="setAlign('right')">Right</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Font Size (px)</label>
                        <input type="number" class="control-input" id="fontSize" value="${block.fontSize}" min="12" max="48">
                        <button class="btn" style="width: 100%; margin-top: 8px;" onclick="updateFontSize()">Update</button>
                    </div>
                `;

                // Initialize Quill
                setTimeout(() => {
                    const editor = new Quill('#editor', {
                        theme: 'snow',
                        modules: {
                            toolbar: [
                                ['bold', 'italic', 'underline'],
                                ['link', 'image'],
                                ['clean']
                            ]
                        }
                    });
                    editor.root.innerHTML = block.content;
                    activeEditor = editor;
                    editor.on('text-change', () => {
                        block.content = editor.root.innerHTML;
                    });
                }, 0);
            } else if (block.type === 'image') {
                controls.innerHTML = `
                    <div class="control-group">
                        <label class="control-label">Max Width (%)</label>
                        <input type="number" class="control-input" id="imgWidth" value="${block.maxWidth}" min="20" max="100">
                    </div>
                    <div class="control-group">
                        <label class="control-label">Alignment</label>
                        <div class="align-buttons">
                            <button class="align-btn" onclick="setImageAlign('left')">Left</button>
                            <button class="align-btn ${block.align === 'center' ? 'active' : ''}" onclick="setImageAlign('center')">Center</button>
                            <button class="align-btn" onclick="setImageAlign('right')">Right</button>
                        </div>
                    </div>
                    <button class="btn" style="width: 100%;" onclick="updateImage()">Update</button>
                `;
            }

            renderCanvas();
        }

        function toggleBold() {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.bold = !block.bold;
            selectBlock(selectedBlockId);
            renderCanvas();
        }

        function setAlign(align) {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.align = align;
            selectBlock(selectedBlockId);
            renderCanvas();
        }

        function setImageAlign(align) {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.align = align;
            selectBlock(selectedBlockId);
            renderCanvas();
        }

        function updateFontSize() {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.fontSize = parseInt(document.getElementById('fontSize').value);
            renderCanvas();
        }

        function updateImage() {
            const block = blocks.find(b => b.id === selectedBlockId);
            block.maxWidth = parseInt(document.getElementById('imgWidth').value);
            renderCanvas();
        }

        function deleteBlock(blockId) {
            blocks = blocks.filter(b => b.id !== blockId);
            selectedBlockId = null;
            renderCanvas();
        }

        function saveLayout() {
            const html = blocks.map(block => {
                if (block.type === 'text') {
                    return `<p style="text-align:${block.align};font-size:${block.fontSize}px;${block.bold ? 'font-weight:bold;' : ''}">${block.content}</p>`;
                } else {
                    return `<img src="${block.src}" alt="${block.alt}" style="max-width:${block.maxWidth}%;height:auto;${block.align === 'center' ? 'display:block;margin:0 auto;' : ''}border-radius:8px;">`;
                }
            }).join('\n');

            const formData = new URLSearchParams({
                title: '{{ post.title }}',
                slug: '{{ post.slug }}',
                excerpt: '{{ post.excerpt }}',
                content: html,
                hero_image: '{{ post.hero_image }}',
                template: '{{ post.template }}',
                status: '{{ post.status }}'
            });

            fetch(`/admin/blog/${postId}/edit`, {
                method: 'POST',
                headers: { 'X-CSRF-Token': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(() => {
                window.location.href = `/admin/blog/${postId}/edit`;
            }).catch(err => console.error('Error:', err));
        }

        function goBack() {
            if (confirm('Discard all changes?')) {
                fetch(`/admin/blog/${postId}/delete`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } })
                    .then(() => window.location.href = '/admin#blog');
            }
        }

        renderCanvas();
    </script>
</body>
</html>
