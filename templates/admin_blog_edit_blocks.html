<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Bolder Electric</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='js/grapes.min.css') }}">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        .top-bar {
            background: #111;
            border-bottom: 1px solid rgba(241,186,32,0.22);
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .title-input {
            font-size: 18px;
            font-weight: bold;
            background: transparent;
            border: none;
            color: #f5f3ef;
            flex: 1;
            padding: 8px;
        }

        .title-input:focus { outline: none; color: #f1ba20; }

        .btn {
            padding: 8px 16px;
            border: 1px solid rgba(241,186,32,0.22);
            background: rgba(241,186,32,0.12);
            color: #f1ba20;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn:hover { background: rgba(241,186,32,0.2); }
        .btn.primary { background: rgba(241,186,32,0.25); }

        #editor {
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }

        .gjs-editor-cont {
            display: flex !important;
            flex-direction: row !important;
        }

        .gjs-viewport {
            flex: 1 !important;
            background: white !important;
        }

        .gjs-pn-panel.gjs-pn-left {
            min-width: 200px;
            flex: 0 0 220px;
        }

        .gjs-pn-panel.gjs-pn-right {
            min-width: 200px;
            flex: 0 0 250px;
        }

        /* GrapesJS Theme */
        .gjs-editor-cont { background: #0a0a0a !important; }
        .gjs-panel__top { background: #111 !important; border-bottom: 1px solid rgba(241,186,32,0.22) !important; }
        .gjs-pn-panel { background: #161616 !important; border-color: rgba(241,186,32,0.22) !important; }
        .gjs-pn-btn { color: rgba(245,243,239,0.6) !important; }
        .gjs-pn-btn:hover { background: rgba(241,186,32,0.1) !important; color: #f1ba20 !important; }
        .gjs-pn-btn.gjs-pn-active { background: rgba(241,186,32,0.2) !important; color: #f1ba20 !important; }
        .gjs-pn-input { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(241,186,32,0.22) !important; color: #f5f3ef !important; }
        .gjs-pn-input:focus { border-color: #f1ba20 !important; }
        .gjs-pn-label { color: rgba(245,243,239,0.6) !important; }
        .gjs-block { background: rgba(241,186,32,0.1) !important; border: 1px solid rgba(241,186,32,0.2) !important; color: #f5f3ef !important; }
        .gjs-block:hover { background: rgba(241,186,32,0.2) !important; }
        .gjs-canvas { background: linear-gradient(135deg, rgba(241,186,32,0.02) 0%, transparent 100%) !important; }
        .gjs-frame { background: #f5f3ef !important; }
    </style>
</head>
<body>
    <div class="top-bar">
        <input type="text" class="title-input" id="titleInput" placeholder="Post Title" value="{{ post.title or '' }}">
        <button class="btn" onclick="goBack()">← Discard</button>
        <button class="btn primary" onclick="savePost()">Save & Publish</button>
    </div>

    <div id="editor"></div>

    <script src="{{ url_for('static', filename='js/grapes.min.js') }}"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        const postId = {{ post.id }};
        const postContent = `{{ post.content | safe }}`;

        // Wait for GrapesJS to load with timeout
        const maxWaitTime = 5000;
        const startTime = Date.now();

        function initEditor() {
            if (typeof grapesjs === 'undefined') {
                if (Date.now() - startTime < maxWaitTime) {
                    setTimeout(initEditor, 100);
                    return;
                }
                console.error('GrapesJS failed to load after timeout');
                document.getElementById('editor').innerHTML = '<p style="color: red; padding: 40px; text-align: center;">Error: Failed to load editor library. Please refresh the page.</p>';
                return;
            }

            // Initialize editor
            const editor = grapesjs.init({
                container: '#editor',
                fromElement: false,
                height: '100%',
                storageManager: false,
                undoManager: { trackChanges: true },
                panels: {
                    defaults: [
                        {
                            id: 'layers',
                            el: '.gjs-pm-open',
                            buttons: [{ id: 'open-layers', active: true, label: 'Layers', command: 'open-layers' }]
                        },
                        {
                            id: 'devices',
                            el: '.gjs-pm-open',
                            buttons: [{ id: 'device-desktop', active: true, label: 'Desktop', command: 'set-device-desktop' }]
                        }
                    ]
                },
                blockManager: {
                    blocks: [
                        {
                            id: 'text',
                            label: 'Text',
                            content: '<p>Add your text here</p>',
                            category: 'Basic'
                        },
                        {
                            id: 'image',
                            label: 'Image',
                            content: '<img src="https://via.placeholder.com/600x400" style="width:100%;">',
                            category: 'Basic'
                        },
                        {
                            id: 'section',
                            label: 'Section',
                            content: '<section style="padding:20px; background:#f0f0f0;"><h2>Section Title</h2><p>Add your content here</p></section>',
                            category: 'Layout'
                        }
                    ]
                },
                styleManager: {
                    sectors: [
                        {
                            name: 'General',
                            open: false,
                            buildProps: ['float', 'display', 'position']
                        },
                        {
                            name: 'Dimension',
                            open: false,
                            buildProps: ['margin', 'padding', 'width', 'height']
                        },
                        {
                            name: 'Typography',
                            open: false,
                            buildProps: ['font-family', 'font-size', 'font-weight', 'color']
                        }
                    ]
                },
                traitManager: {
                    autoOpen: false
                }
            });

            // Load existing content
            if (postContent && postContent.trim()) {
                try {
                    editor.setComponents(postContent);
                } catch (e) {
                    console.log('Could not parse existing content, starting fresh');
                }
            }

            // Custom save command
            editor.Commands.add('save-post', {
                run() { savePost(); }
            });

            window.savePost = function() {
                const title = document.getElementById('titleInput').value.trim();
                if (!title) {
                    alert('Please enter a title');
                    return;
                }

                const html = editor.getHtml();
                const css = editor.getCss();

                const formData = new URLSearchParams({
                    title,
                    slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                    excerpt: '{{ post.excerpt or '' }}',
                    content: html,
                    hero_image: '{{ post.hero_image or '' }}',
                    template: '{{ post.template or 1 }}',
                    status: 'published'
                });

                const endpoint = postId === 0 ? '/admin/blog/new' : `/admin/blog/${postId}/edit`;

                fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'X-CSRF-Token': csrfToken,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                })
                .then(res => {
                    if (!res.ok) throw new Error('Save failed');
                    window.location.href = '/admin#blog';
                })
                .catch(err => alert('Error: ' + err.message));
            };

            window.goBack = function() {
                if (confirm('Discard all changes?')) {
                    window.location.href = '/admin#blog';
                }
            };
        }

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEditor);
        } else {
            initEditor();
        }
    </script>
</body>
</html>
